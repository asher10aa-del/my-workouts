const playBeep = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = [523, 659, 784];
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.35);
    });
  } catch(e) { console.warn("Audio Context blocked", e); }
};

function calcStats(history) {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  let streak = 0, d = new Date(today);
  
  if (!history[todayStr] || history[todayStr]?.status !== 'done') d.setDate(d.getDate() - 1);
  
  while (true) {
    const s = d.toISOString().split('T')[0];
    if (history[s]?.status === 'done') { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  
  const entries = Object.entries(history);
  const totalDone = entries.filter(([, r]) => r.status === 'done').length;
  const mStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
  const monthDone = entries.filter(([d, r]) => d >= mStart && r.status === 'done').length;
  const monthMissed = entries.filter(([d, r]) => d >= mStart && r.status === 'missed').length;
  
  const weeks = [];
  for (let w = 7; w >= 0; w--) {
    const ws = new Date(today); ws.setDate(today.getDate() - (w * 7 + today.getDay()));
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    const wsS = ws.toISOString().split('T')[0], weS = we.toISOString().split('T')[0];
    weeks.push(entries.filter(([d, r]) => d >= wsS && d <= weS && r.status === 'done').length);
  }
  return { streak, totalDone, monthDone, monthMissed, weeks };
}

function ExerciseEditModal({ exercise, onSave, onClose, prefs }) {
  const [d, setD] = useState({ notes: '', setDetails: [], ...exercise });

  useEffect(() => {
    document.body.classList.add('modal-open');
    return () => document.body.classList.remove('modal-open');
  }, []);

  useEffect(() => {
    const numSets = parseInt(d.sets) || 0;
    const currentDetails = d.setDetails || [];
    if (numSets > currentDetails.length) {
      const newDetails = [...currentDetails];
      for (let i = currentDetails.length; i < numSets; i++) {
        newDetails.push({ reps: d.reps || '', done: false });
      }
      setD(p => ({...p, setDetails: newDetails}));
    } else if (numSets < currentDetails.length) {
      setD(p => ({...p, setDetails: currentDetails.slice(0, numSets)}));
    }
  }, [d.sets]);

  const updateSetDetail = (idx, field, value) => {
    const newDetails = [...d.setDetails];
    newDetails[idx] = { ...newDetails[idx], [field]: value };
    setD(p => ({ ...p, setDetails: newDetails }));
  };
  
  return (
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-5 fade-in" style={{ background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(10px)' }} onClick={onClose}>
      <div className="card w-full max-w-sm p-7 relative slide-down max-h-[90vh] overflow-y-auto no-scroll" dir="rtl" onClick={(e) => e.stopPropagation()}>
        <button onClick={onClose} className="absolute top-4 left-4 p-2 rounded-xl btn-press z-10" style={{ color: 'var(--muted)', background: 'rgba(255,255,255,0.05)' }}>
          <Ic n="x" size={18}/>
        </button>
        <h3 className="text-xl font-black text-center mb-6 text-white pt-2">עריכת תרגיל</h3>
        <div className="space-y-4">
          <div>
            <label className="text-xs font-bold mb-2 block text-gray-400">שם התרגיל</label>
            <input className="w-full p-3.5 rounded-xl styled-input font-bold text-right"
              value={d.name} onChange={e => setD(p => ({ ...p, name: e.target.value }))} />
          </div>
          <div className="grid grid-cols-3 gap-3">
            {[['sets', 'סטים', 'number'], ['reps', 'חזרות', 'number'], ['weight', 'משקל ק"ג', 'text']].map(([f, l, t]) => (
              <div key={f}>
                <label className="text-[10px] uppercase font-bold mb-2 block text-center text-gray-400">{l}</label>
                <input type={t} className="w-full p-3 rounded-xl styled-input text-center font-black"
                  style={{ color: f === 'weight' ? 'var(--primary)' : 'var(--text)' }}
                  value={d[f]} onChange={e => setD(p => ({ ...p, [f]: e.target.value }))} />
              </div>
            ))}
          </div>
          <div>
            <label className="text-xs font-bold mb-2 block text-gray-400">הערות / דגשים לתרגיל</label>
            <textarea className="w-full p-3.5 rounded-xl styled-input text-right text-sm min-h-[60px]"
              placeholder="למשל: ספסל על שלב 4..." value={d.notes || ''} onChange={e => setD(p => ({ ...p, notes: e.target.value }))} />
          </div>

          {prefs.setTable && d.setDetails && d.setDetails.length > 0 && (
            <div className="mt-4 p-4 rounded-xl bg-black/30 border border-white/5">
              <label className="text-xs font-bold mb-3 block text-gray-400 text-center">מעקב חזרות בפועל</label>
              <div className="space-y-2">
                {d.setDetails.map((setInfo, idx) => (
                  <div key={idx} className="flex items-center gap-3">
                    <span className="w-10 text-xs font-bold text-gray-500 text-center">סט {idx + 1}</span>

  return (
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-5 fade-in" style={{ background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(8px)' }} onClick={onClose}>
      <div className="card w-full max-w-sm p-6 relative text-center slide-down" onClick={(e) => e.stopPropagation()}>
        <button onClick={onClose} className="absolute top-4 left-4 p-2 rounded-xl btn-press" style={{ color: 'var(--muted)', background: 'rgba(255,255,255,0.05)' }}>
          <Ic n="x" size={18}/>
        </button>
        <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style={{ background: 'rgba(59,130,246,0.1)', border: '1px solid rgba(59,130,246,0.2)' }}>
          <Ic n="calendar" size={28} style={{ color: 'var(--primary)' }}/>
        </div>
        <h3 className="text-lg font-black mb-6 text-white">{label}</h3>
        
        <div className="text-right rounded-xl p-4 mb-6" style={{ background: 'rgba(0,0,0,0.4)', border: '1px solid var(--border)' }}>
          <label className="text-xs font-bold mb-2 block text-gray-400">איזה אימון?</label>
          <select className="w-full p-3 rounded-xl font-bold styled-input" dir="rtl"
            value={selId} onChange={e => setSelId(e.target.value)}>
            {categories.map(c => <option key={c.id} value={c.id}>{c.name}{c.id === plannedId ? ' (מתוכנן)' : ''}</option>)}
          </select>
        </div>
        
        <div className="flex gap-3 mb-4">
          <button onClick={() => { onUpdateStatus(dateStr, 'done', selId); onClose(); }}
            className={`flex-1 p-4 rounded-xl font-black flex flex-col items-center gap-1.5 btn-press transition-all ${record?.status === 'done' ? 'text-white' : 'text-emerald-400'}`}
            style={{ background: record?.status === 'done' ? '#059669' : 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.3)' }}>
            <Ic n="check" size={22}/><span className="text-xs">בוצע בהצלחה</span>
          </button>
          <button onClick={() => { onUpdateStatus(dateStr, 'missed', selId); onClose(); }}
            className={`flex-1 p-4 rounded-xl font-black flex flex-col items-center gap-1.5 btn-press transition-all ${record?.status === 'missed' ? 'text-white' : 'text-rose-400'}`}
            style={{ background: record?.status === 'missed' ? '#e11d48' : 'rgba(244,63,94,0.1)', border: '1px solid rgba(244,63,94,0.3)' }}>
            <Ic n="x" size={22}/><span className="text-xs">דולג / מנוחה</span>
          </button>
        </div>
        {record && (
          <button onClick={() => { onUpdateStatus(dateStr, null, null); onClose(); }}
            className="w-full p-3.5 rounded-xl font-bold btn-press mt-2 text-sm"
            style={{ background: 'rgba(255,255,255,0.05)', color: 'var(--muted)' }}>
            איפוס רישום ליום זה
          </button>
        )}
      </div>
    </div>
  );
}

/* ══════════════ MAIN APPLICATION ══════════════ */
function App() {
  const [page, setPage] = useState('home');
  const [workout, setWorkout] = useState(null);
  const [isTransitioning, setIsTransitioning] = useState(false);
  
  const getInitial = (key, def) => S.get(`wk_${VER}_${key}`, S.get(`wk_v28_${key}`, S.get(`wk_v27_${key}`, S.get(`wk_v26_${key}`, S.get(`wk_v25_${key}`, S.get(`wk_v24_${key}`, S.get(`wk_v16_${key}`, def)))))));
  
  const [cats, setCats] = useState(() => getInitial('cats', DEF_CATS));
  const [hist, setHist] = useState(() => getInitial('hist', {}));
  const [sched, setSched] = useState(() => getInitial('sched', DEF_SCHED));
  const [theme, setTheme] = useState(() => getInitial('theme', 'default'));
  const [prefs, setPrefs] = useState(() => getInitial('prefs', DEF_PREFS));

  const [manage, setManage] = useState(false);
  const [draftCats, setDraftCats] = useState(null);
  const [editEx, setEditEx] = useState(null);
  const [copiedEx, setCopiedEx] = useState(null);

  const [timeLeft, setTimeLeft] = useState(0);
  const [timerOn, setTimerOn] = useState(false);
  const [timerOpen, setTimerOpen] = useState(false);
  const [timerMinimized, setTimerMinimized] = useState(false);

  const [calDate, setCalDate] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const [selDate, setSelDate] = useState(null);
  const fileRef = useRef(null);
  const scrollPositions = useRef({});
  
  const navigate = (newPage, newWorkout = null) => {
    scrollPositions.current[`${page}_${workout || 'main'}`] = window.scrollY;
    setIsTransitioning(true);
    setPage(newPage);
    setWorkout(newWorkout);
    setTimeout(() => {
      window.scrollTo(0, scrollPositions.current[`${newPage}_${newWorkout || 'main'}`] || 0);
      setTimeout(() => setIsTransitioning(false), 50);
    }, 0);
  };

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  useEffect(() => S.set(`wk_${VER}_cats`, cats), [cats]);
  useEffect(() => S.set(`wk_${VER}_hist`, hist), [hist]);
  useEffect(() => S.set(`wk_${VER}_sched`, sched), [sched]);
  useEffect(() => S.set(`wk_${VER}_theme`, theme), [theme]);
  useEffect(() => S.set(`wk_${VER}_prefs`, prefs), [prefs]);

  useEffect(() => {
    if (timerOpen) document.body.classList.add('modal-open');
    else document.body.classList.remove('modal-open');
  }, [timerOpen]);

  useEffect(() => {
    if (!prefs.timer) return; 
    let iv;
    if (timerOn && timeLeft > 0) {
      iv = setInterval(() => setTimeLeft(t => t - 1), 1000);
    } else if (timerOn && timeLeft === 0) {
      setTimerOn(false); setTimerOpen(true); setTimerMinimized(false); playBeep();
    }
    return () => clearInterval(iv);
  }, [timerOn, timeLeft, prefs.timer]);

  const startTimer = useCallback((s) => { setTimeLeft(s); setTimerOn(true); setTimerMinimized(true); setTimerOpen(false); }, []);
  const stopTimer = () => { setTimerOn(false); setTimeLeft(0); setTimerMinimized(false); setTimerOpen(false); };

  const today = new Date();
  const todayKey = today.toISOString().split('T')[0];
  const dayName = today.toLocaleDateString('he-IL', { weekday: 'long' });
  const planned = useMemo(() => cats.find(c => c.id === sched[today.getDay()]), [cats, sched, today.getDay()]);
  const stats = useMemo(() => calcStats(hist), [hist]);
  
  const dispCats = manage ? draftCats : cats;

  const enterManage = () => { setDraftCats(JSON.parse(JSON.stringify(cats))); setManage(true); };
  const saveManage = () => { setCats(draftCats); setManage(false); setDraftCats(null); };
  const cancelManage = () => { setManage(false); setDraftCats(null); };

  const addCat = () => {
    const name = prompt('שם תוכנית האימון החדשה:');
    if (name) setDraftCats([...draftCats, { id: crypto.randomUUID(), name, hex: '#a855f7', icon: 'dumbbell', exercises: [] }]);
  };
  const delCat = (i) => {
    if (confirm(`האם ברצונך למחוק את "${draftCats[i].name}" לחלוטין?`)) {
      const a = [...draftCats]; a.splice(i, 1); setDraftCats(a);
    }
  };
  const renameCat = (i) => {
    const n = prompt('שם התוכנית החדש:', draftCats[i].name);
    if (n) { const a = [...draftCats]; a[i] = { ...a[i], name: n }; setDraftCats(a); }
  };
  
  const moveCat = (i, dir) => {
    const a = [...draftCats], j = i + dir;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; setDraftCats(a);
  };

  const addEx = () => {
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    const ex = { id: crypto.randomUUID(), name: 'הזן תרגיל חדש', sets: 3, reps: 10, weight: '0', notes: '', setDetails: [{reps:'', done:false},{reps:'', done:false},{reps:'', done:false}] };
    a[ci] = { ...a[ci], exercises: [...a[ci].exercises, ex] }; setDraftCats(a); setEditEx(ex);
  };
  
  const delEx = (id) => {
    if (confirm('מחיקת תרגיל זה מהרשימה?')) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.filter(e => e.id !== id) }; setDraftCats(a);
    }
  };

  const moveEx = (i, dir) => {
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    const exs = [...a[ci].exercises], j = i + dir;
    if (j < 0 || j >= exs.length) return;
    [exs[i], exs[j]] = [exs[j], exs[i]]; a[ci] = { ...a[ci], exercises: exs }; setDraftCats(a);
  };

  const saveEx = (upd) => {
    if (manage) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.map(e => e.id === upd.id ? upd : e) }; setDraftCats(a);
    } else {
      const a = [...cats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.map(e => e.id === upd.id ? upd : e) }; setCats(a);
    }
    setEditEx(null);
  };

  const copyExercise = (ex) => {
    setCopiedEx(ex);
    alert('תרגיל הועתק! ניתן להדביק אותו באימון אחר.');
  };

  const pasteExercise = () => {
    if (!copiedEx) return;
    const newEx = { ...copiedEx, id: crypto.randomUUID() }; 
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    a[ci] = { ...a[ci], exercises: [...a[ci].exercises, newEx] }; 
    setDraftCats(a);
  };

  const updateHist = useCallback((dateStr, status, catId) => {
    setHist(prev => {
      const h = { ...prev };
      if (!status) delete h[dateStr];
      else h[dateStr] = { type: catId, status };
      return h;
    });
  }, []);

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ cats, hist, sched, theme, prefs }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `Fitness_Data_${todayKey}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.cats) setCats(d.cats); if (d.hist) setHist(d.hist); if (d.sched) setSched(d.sched); 
        if (d.theme) setTheme(d.theme); if (d.prefs) setPrefs(d.prefs);
        alert('הנתונים שוחזרו בהצלחה מהגיבוי.');
      } catch { alert('קובץ שגוי.'); }
    };
    r.readAsText(file); e.target.value = '';
  };
  const resetAll = () => {
    if (confirm('אזהרה: פעולה זו תמחק את כל היסטוריית האימונים ותאפס להגדרות יצרן. להמשיך?')) {
      setCats(DEF_CATS); setHist({}); setSched(DEF_SCHED); alert('מערכת אופסה בהצלחה.');
    }
  };

  /* ── RENDERERS ── */
  const renderCal = useMemo(() => {
    if (!prefs.calendar) return null;
    const dim = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 0).getDate();
    const firstDay = new Date(calDate.getFullYear(), calDate.getMonth(), 1).getDay();
    const mName = calDate.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
    
    return (
      <div className="card p-6 mt-2" dir="rtl">
        <div className="flex justify-between items-center mb-5 px-1">
          <button onClick={() => setCalDate(new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1))}
            className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400 hover:text-white transition-colors">
            <Ic n="chevR" size={18}/>
          </button>
          <span className="font-black text-lg tracking-wide text-white">{mName}</span>
          <button onClick={() => setCalDate(new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1))}
            className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400 hover:text-white transition-colors">
            <Ic n="chevL" size={18}/>
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1.5 text-center">
          {DAY_LET.map(d => <div key={d} className="text-xs font-bold pb-2 text-gray-500">{d}</div>)}
          {[...Array(firstDay)].map((_, i) => <div key={`e${i}`}/>)}
          {[...Array(dim)].map((_, i) => {
            const dn = i + 1;
            const cd = new Date(calDate.getFullYear(), calDate.getMonth(), dn);
            const ds = cd.toISOString().split('T')[0];
            const rec = hist[ds];
            const pl = cats.find(c => c.id === sched[cd.getDay()]);
            const isToday = dn === today.getDate() && calDate.getMonth() === today.getMonth() && calDate.getFullYear() === today.getFullYear();
            
            let bg = 'rgba(255,255,255,0.02)', border = '1px solid transparent', txtCol = 'var(--text)', ico = null;
            if (rec) {
              if (rec.status === 'done') {
                bg = cats.find(c => c.id === rec.type)?.hex || pl?.hex || '#3b82f6';
                txtCol = 'white'; ico = <Ic n="check" size={12}/>;
              } else {
                bg = 'rgba(244,63,94,0.3)'; border = '1px solid rgba(244,63,94,0.5)'; txtCol = '#f43f5e'; ico = <Ic n="x" size={12}/>;
              }
            } else if (isToday) {
              border = '2px solid var(--primary)'; txtCol = 'var(--primary)'; bg = 'var(--primary-glow)';
            } else if (cd > today) {
               txtCol = 'rgba(255,255,255,0.2)';
            }

            return (
              <div key={dn} onClick={() => setSelDate({ date: cd })}
                className="aspect-square flex flex-col items-center justify-center rounded-[10px] cursor-pointer btn-press text-xs font-bold transition-all hover:scale-105"
                style={{ backgroundColor: bg, border: border, color: txtCol }}>
                {dn}
                <div className="mt-0.5 min-h-[12px]">
                  {ico || (pl && !rec && <div className="w-1.5 h-1.5 rounded-full opacity-70" style={{ backgroundColor: pl.hex }}/>)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }, [calDate, hist, cats, sched, today.getMonth(), today.getFullYear(), today.getDate(), prefs.calendar]);

  const renderHome = () => (
    <div className={`flex flex-col gap-5 p-5 pb-28 ${!isTransitioning ? 'fade-in' : ''}`} dir="rtl">
      <div className="flex justify-between items-center mt-6 px-1">
        <h1 className="text-2xl font-black text-white">האימונים שלי</h1>
        <button onClick={enterManage} className="p-3 rounded-2xl btn-press bg-white/5 border border-white/10 text-gray-300">
          <Ic n="edit" size={20}/>
        </button>
      </div>
      
      <div className="card p-6 border-r-4 relative overflow-hidden" style={{ borderRightColor: planned ? planned.hex : 'var(--border)' }}>
        <p className="text-xs font-bold uppercase mb-1 text-gray-400">{dayName}, מתוכנן להיום:</p>
        <p className="text-3xl font-black text-white">{planned?.name || 'מנוחה'}</p>
        {planned && (
          <button onClick={() => navigate('home', planned.id)} className="mt-4 w-full py-3 rounded-xl font-bold text-white flex items-center justify-center gap-2 btn-press" style={{ background: planned.hex }}>
            <Ic n="arrowLeft" size={18}/> התחל אימון
          </button>
        )}
      </div>

      <div className="grid gap-3">
        <h3 className="text-sm font-black text-gray-300 mt-2">כל האימונים</h3>
        {(manage ? draftCats : cats).map((cat, i) => (
          <div key={cat.id} className="flex items-center gap-2 transition-all">
            {manage && (
              <div className="flex flex-col gap-1">
                <button onClick={() => moveCat(i, -1)} className="p-2 rounded-lg btn-press bg-white/5 text-gray-400"><Ic n="arrowUp" size={16}/></button>
                <button onClick={() => moveCat(i, 1)} className="p-2 rounded-lg btn-press bg-white/5 text-gray-400"><Ic n="arrowDown" size={16}/></button>
              </div>
            )}
            
            <button onClick={() => manage ? renameCat(i) : navigate('home', cat.id)}
              className={`flex-1 flex items-center justify-between p-5 rounded-2xl btn-press transition-all ${manage ? 'border-blue-500/50 bg-blue-500/5' : 'card'}`}>
              <div className="flex items-center gap-4">
                <span className="p-3 rounded-xl shadow-inner" style={{ background: 'rgba(0,0,0,0.4)', color: cat.hex }}><Ic n={cat.icon} size={22}/></span>
                <span className="text-lg font-black text-white">{cat.name}</span>
              </div>
              {manage ? <Ic n="edit" size={20} style={{ color: 'var(--primary)' }}/> : <Ic n="arrowLeft" size={20} style={{ color: 'rgba(255,255,255,0.2)' }}/>}
            </button>
            {manage && <button onClick={() => delCat(i)} className="p-5 rounded-2xl btn-press bg-rose-500/10 text-rose-500 border border-rose-500/20"><Ic n="trash" size={20}/></button>}
          </div>
        ))}
        {manage && (
          <button onClick={addCat} className="w-full mt-2 p-5 rounded-2xl font-bold flex flex-col items-center gap-2 btn-press border-2 border-dashed border-white/20 text-gray-400 hover:text-white hover:border-white/40 transition-colors">
            <Ic n="plus" size={24}/> הוסף אימון חדש
          </button>
        )}
      </div>
      {renderCal}
    </div>
  );

  const renderWorkoutDetail = () => {
    const cat = dispCats.find(c => c.id === workout);
    if (!cat) return null;
    
    const exercisesToRender = manage ? cat.exercises : cat.exercises;

    const totalExercises = cat.exercises.length;
    let totalWeight = 0;
    cat.exercises.forEach(ex => {
      const sets = parseInt(ex.sets) || 0;
      const reps = parseInt(ex.reps) || 0;
      const weightStr = (ex.weight || '0').split('/')[0].trim();
      const weight = parseFloat(weightStr) || 0;
      totalWeight += (sets * reps * weight);
    });

    return (
      <div className={`p-5 pb-32 ${!isTransitioning ? 'fade-in' : ''}`} dir="rtl">
        <div className="flex justify-between items-center mt-6 mb-8 px-1">
          {!manage ? (
            <button onClick={() => navigate('home', null)} className="flex items-center gap-2 btn-press text-gray-400 bg-white/5 px-4 py-2 rounded-xl">
              <Ic n="chevR" size={20}/><span className="font-bold text-sm">חזור</span>
            </button>
          ) : (
            <span className="text-xs font-black px-4 py-2 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400">מצב עריכת אימון</span>
          )}
          {!manage && <button onClick={enterManage} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-300"><Ic n="edit" size={20}/></button>}
        </div>

        <h2 className="text-4xl font-black text-white mb-6 px-2">{cat.name}</h2>

        <div className="space-y-4">
          {exercisesToRender.map((ex, idx) => (
            <div key={ex.id} className="flex gap-2 transition-all">
              
              {manage && (
                <div className="flex flex-col gap-1 justify-center">
                  <button onClick={() => moveEx(idx, -1)} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400"><Ic n="arrowUp" size={16}/></button>
                  <button onClick={() => moveEx(idx, 1)} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400"><Ic n="arrowDown" size={16}/></button>
                </div>
              )}

              <div className={`flex-1 p-5 rounded-2xl relative overflow-hidden flex flex-col transition-colors btn-press ${manage ? 'bg-blue-500/10 border border-blue-500/30' : 'card'}`}
                   onClick={(e) => { e.stopPropagation(); setEditEx(ex); }}>
                <div className="absolute top-0 right-0 w-1.5 h-full opacity-60 rounded-l-full" style={{ backgroundColor: cat.hex }}/>
                
                <div className="flex justify-between items-start pr-3">
                   <div className="flex-1">
                    <h4 className="font-black text-lg mb-2 text-white">{ex.name}</h4>
                    <div className="flex gap-5 text-sm mb-2">
                      <span className="text-gray-400 font-bold">{ex.sets} <span className="text-[10px]">סטים</span></span>
                      <span className="text-gray-400 font-bold">{ex.reps} <span className="text-[10px]">חזרות</span></span>
                      <span className="font-black drop-shadow-sm" style={{ color: cat.hex }}>{ex.weight} <span className="text-[10px]">ק"ג</span></span>
                    </div>
                    {ex.notes && <p className="text-xs text-gray-500 italic bg-black/20 p-2 rounded-lg inline-block border border-white/5">{ex.notes}</p>}
                    
                    {!manage && prefs.setTable && ex.setDetails && ex.setDetails.some(s => s.done) && (
                      <div className="mt-3 flex gap-2 flex-wrap">
                        {ex.setDetails.map((s, i) => s.done && (
                           <span key={i} className="text-[10px] font-bold px-2 py-1 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                             סט {i+1}: {s.reps} חז'
                           </span>
                        ))}
                      </div>
                    )}
                  </div>
                  
                  {manage && (
                    <div className="flex gap-2">
                       <button onClick={(e) => { e.stopPropagation(); copyExercise(ex); }} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400"><Ic n="copy" size={18}/></button>
                       <button onClick={(e) => { e.stopPropagation(); delEx(ex.id); }} className="p-2.5 rounded-xl btn-press bg-rose-500/10 text-rose-500 border border-rose-500/20"><Ic n="trash" size={18}/></button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))}
          
          {manage && (
            <div className="flex gap-2 mt-4">
              <button onClick={addEx} className="flex-1 p-5 rounded-2xl font-bold flex flex-col items-center gap-2 btn-press border-2 border-dashed border-white/20 text-gray-400 hover:text-white hover:border-white/40 transition-colors">
                <Ic n="plus" size={24}/> הוסף תרגיל
              </button>
              {copiedEx && (
                <button onClick={pasteExercise} className="flex-1 p-5 rounded-2xl font-bold flex flex-col items-center gap-2 btn-press border-2 border-dashed border-blue-500/30 text-blue-400 hover:bg-blue-500/10 transition-colors">
                  <Ic n="paste" size={24}/> הדבק תרגיל
                </button>
              )}
            </div>
          )}
        </div>

        {!manage && (
          <div className="mt-10 p-6 card2 border-t-4" style={{borderTopColor: cat.hex}}>
            <h3 className="font-black text-sm mb-4 text-white">סיכום אימון משוער</h3>
            <div className="flex justify-between items-center text-sm">
              <span className="text-gray-400 font-bold">סה"כ תרגילים:</span>
              <span className="font-black text-white">{totalExercises}</span>
            </div>
            <div className="h-px bg-white/10 my-3"></div>
            <div className="flex justify-between items-center text-sm">
              <span className="text-gray-400 font-bold">נפח משקל כולל:</span>
              <span className="font-black text-lg" style={{color: cat.hex}}>{totalWeight.toLocaleString()} ק"ג</span>
            </div>
            <p className="text-[10px] text-gray-500 mt-2">*חישוב גס המבוסס על (סטים × חזרות × משקל ראשון).</p>
          </div>
        )}
      </div>
    );
  };

  const renderStats = () => {
    const maxW = Math.max(...stats.weeks, 1);
    const catBreak = {};
    Object.values(hist).filter(r => r.status === 'done').forEach(r => { catBreak[r.type] = (catBreak[r.type] || 0) + 1; });
    const rate = stats.monthDone + stats.monthMissed > 0 ? Math.round((stats.monthDone / (stats.monthDone + stats.monthMissed)) * 100) : 0;
    
    return (
      <div className={`p-5 pb-28 ${!isTransitioning ? 'slide-up' : ''}`} dir="rtl">
        <h2 className="text-3xl font-black mt-6 mb-8 text-white px-2">סטטיסטיקה ומעקב</h2>

        <div className="grid grid-cols-2 gap-4 mb-6">
          {[
            { ico: 'trophy', val: stats.totalDone, label: 'סך הכל', sub: 'אימונים שהושלמו', col: '#f59e0b' },
            { ico: 'flame', val: stats.streak, label: 'רצף נוכחי', sub: 'ימי אימון רצופים', col: '#f97316' },
            { ico: 'target', val: `${rate}%`, label: 'אחוז התמדה', sub: 'יחס ביצוע לתכנון', col: '#3b82f6' },
            { ico: 'check', val: stats.monthDone, label: 'החודש', sub: 'ביצועים חודשיים', col: '#10b981' },
          ].map(({ ico, val, label, sub, col }) => (
            <div key={label} className="card p-5 flex flex-col items-center text-center">
              <Ic n={ico} size={28} cls="mb-3" style={{ color: col, filter: `drop-shadow(0 0 8px ${col}40)` }}/>
              <div className="text-4xl font-black mb-1.5 text-white">{val}</div>
              <div className="text-sm font-black text-gray-200">{label}</div>
              <div className="text-[10px] mt-1 leading-tight text-gray-500 font-medium">{sub}</div>
            </div>
          ))}
        </div>

        <div className="card p-6 mb-6">
          <h3 className="font-black text-sm mb-5 text-white">גרף אימונים (8 שבועות אחרונים)</h3>
          <div className="flex items-end gap-2 h-32">
            {stats.weeks.map((cnt, i) => (
              <div key={i} className="flex-1 flex flex-col items-center gap-1.5">
                <span className="text-xs font-bold text-gray-400">{cnt > 0 ? cnt : ''}</span>
                <div className="w-full rounded-t-lg transition-all duration-700 ease-out" style={{
                  height: `${Math.max((cnt / maxW) * 90, cnt > 0 ? 8 : 4)}px`,
                  background: cnt > 0 ? `linear-gradient(180deg, var(--primary), transparent)` : 'rgba(255,255,255,0.05)',
                  boxShadow: i === 7 && cnt > 0 ? '0 0 10px var(--primary-glow)' : 'none',
                  opacity: cnt > 0 ? 0.6 + (cnt / maxW) * 0.4 : 1,
                }}/>
                <span className="text-[9px] text-gray-500 font-bold">{i === 7 ? 'נוכחי' : `ש' ${8-i}`}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="card p-6 mb-6">
          <h3 className="font-black text-sm mb-5 text-white">התפלגות סוגי אימון</h3>
          <div className="space-y-4">
            {cats.map(cat => {
              const cnt = catBreak[cat.id] || 0;
              const pct = stats.totalDone > 0 ? (cnt / stats.totalDone) * 100 : 0;
              return (
                <div key={cat.id}>
                  <div className="flex justify-between text-sm mb-2">
                    <div className="flex items-center gap-2.5">
                      <div className="w-2.5 h-2.5 rounded-full shadow-sm" style={{ backgroundColor: cat.hex, boxShadow: `0 0 6px ${cat.hex}` }}/>
                      <span className="font-bold text-white">{cat.name}</span>
                    </div>
                    <span className="font-medium text-gray-400">{cnt} אימונים ({Math.round(pct)}%)</span>
                  </div>
                  <div className="h-2.5 rounded-full overflow-hidden bg-white/5 border border-white/5">
                    <div className="h-full rounded-full transition-all duration-1000 ease-out" style={{ width: `${pct}%`, backgroundColor: cat.hex, boxShadow: `0 0 10px ${cat.hex}80` }}/>
                  </div>
                </div>
              );
            })}
          </div>
          {stats.totalDone === 0 && <p className="text-center text-sm mt-4 text-gray-500 font-medium">המערכת ממתינה לנתונים... התחל לתעד! 💪</p>}
        </div>
      </div>
    );
  };

  const renderSettings = () => (
    <div className={`p-5 pb-28 ${!isTransitioning ? 'slide-up' : ''}`} dir="rtl">
      <h2 className="text-3xl font-black mt-6 mb-8 text-white px-2">הגדרות מתקדמות</h2>

      <div className="card p-6 mb-5">
        <h3 className="font-black text-sm mb-5 flex items-center gap-2.5 text-white">
          <span className="p-1.5 bg-purple-500/10 rounded-lg text-purple-400"><Ic n="settings" size={18}/></span> התאמת ממשק
        </h3>
        <div className="space-y-3">
          <Toggle label="טיימר מנוחה צף" icon="clock" checked={prefs.timer} onChange={v => setPrefs({...prefs, timer: v})} />
          <Toggle label="לוח שנה במסך ראשי" icon="calendar" checked={prefs.calendar} onChange={v => setPrefs({...prefs, calendar: v})} />
          <Toggle label="עמוד סטטיסטיקה ומעקב" icon="barChart" checked={prefs.stats} onChange={v => setPrefs({...prefs, stats: v})} />
          <Toggle label="טבלת מעקב לכל סט" icon="edit" checked={prefs.setTable} onChange={v => setPrefs({...prefs, setTable: v})} />
        </div>
      </div>

      <div className="card p-6 mb-5">
        <h3 className="font-black text-sm mb-5 flex items-center gap-2.5 text-white">
          <span className="p-1.5 bg-yellow-500/10 rounded-lg text-yellow-400"><Ic n="palette" size={18}/></span> ערכת נושא
        </h3>
        <div className="grid grid-cols-2 gap-3">
          {[
            { id: 'default', name: 'קלאסי (כחול)' },
            { id: 'emerald', name: 'אמרלד (ירוק)' },
            { id: 'ocean', name: 'אוקיינוס (תכלת)' },
            { id: 'cherry', name: 'דובדבן (אדום)' },
            { id: 'sunset', name: 'שקיעה (כתום)' },
          ].map(t => (
            <button key={t.id} onClick={() => setTheme(t.id)} 
              className={`p-3.5 rounded-xl text-center font-bold text-sm btn-press transition-all ${theme === t.id ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-inner' : 'bg-white/5 text-gray-400 border border-transparent'}`}>
              {t.name}
            </button>
          ))}
        </div>
      </div>

      <div className="card p-6 mb-5">
        <h3 className="font-black text-sm mb-5 flex items-center gap-2.5 text-white">
          <span className="p-1.5 bg-blue-500/10 rounded-lg text-blue-400"><Ic n="calendar" size={18}/></span> לוח אימונים קבוע
        </h3>
        <div className="space-y-2.5">
          {[0, 1, 2, 3, 4, 5, 6].map(di => {
            const pid = sched[di];
            const c = cats.find(x => x.id === pid);
            return (
              <div key={di} className="flex items-center gap-3 p-3.5 rounded-xl border border-white/5 bg-black/20 transition-colors focus-within:border-blue-500/30">
                <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 text-sm font-black bg-white/5 text-gray-400">{DAY_LET[di]}</div>
                <span className="text-sm font-bold w-14 flex-shrink-0 text-gray-300">{DAY_NAMES[di]}</span>
                <select className="flex-1 p-2 rounded-lg text-sm font-bold outline-none styled-input bg-transparent border-none focus:ring-0" dir="rtl"
                  value={pid || ''}
                  onChange={e => setSched(prev => ({ ...prev, [di]: e.target.value || null }))}>
                  <option value="" className="text-gray-800">☕ מנוחה</option>
                  {cats.map(cat => <option key={cat.id} value={cat.id} className="text-gray-800">{cat.name}</option>)}
                </select>
                {c && <div className="w-3 h-3 rounded-full flex-shrink-0 shadow-sm" style={{ backgroundColor: c.hex, boxShadow: `0 0 6px ${c.hex}80` }}/>}
              </div>
            );
          })}
        </div>
      </div>

      <div className="card p-6 mb-5">
        <h3 className="font-black text-sm mb-4 flex items-center gap-2.5 text-white">
          <span className="p-1.5 bg-emerald-500/10 rounded-lg text-emerald-400"><Ic n="download" size={18}/></span> גיבוי וניהול
        </h3>
        <div className="space-y-3">
          <button onClick={exportData} className="w-full p-4 rounded-xl font-black flex items-center justify-center gap-2.5 btn-press bg-blue-500/10 border border-blue-500/20 text-blue-400 hover:bg-blue-500/20 transition-colors">
            <Ic n="download" size={20}/> ייצוא קובץ גיבוי
          </button>
          <button onClick={() => fileRef.current?.click()} className="w-full p-4 rounded-xl font-black flex items-center justify-center gap-2.5 btn-press bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20 transition-colors">
            <Ic n="upload" size={20}/> טעינת גיבוי קיים
          </button>
          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importData}/>
          
          <div className="h-px bg-white/10 my-4"></div>
          
          <button onClick={() => window.location.reload(true)} className="w-full p-4 rounded-xl font-black flex items-center justify-center gap-2.5 btn-press bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 transition-colors">
            <Ic n="refresh" size={20}/> כפה רענון גרסה מהשרת
          </button>
        </div>
      </div>
    </div>
  );

  const NAV = [
    { id: 'home', n: 'home', label: 'ראשי' },
    ...(prefs.stats ? [{ id: 'stats', n: 'barChart', label: 'נתונים' }] : []),
    { id: 'settings', n: 'settings', label: 'הגדרות' },
  ];

  const fmtTime = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;

  return (
    <div className="min-h-screen relative">
      <main className="relative z-10 max-w-lg mx-auto min-h-screen">
        {workout ? renderWorkoutDetail() : page === 'home' ? renderHome() : page === 'stats' ? renderStats() : renderSettings()}
      </main>

      {!manage && prefs.timer && (
        <div className="fixed z-50 transition-all duration-300" style={{ bottom: '6rem', left: '1.5rem' }}>
          {timerMinimized && timeLeft > 0 && !timerOpen ? (
            <button onClick={() => { setTimerMinimized(false); setTimerOpen(true); }}
              className="px-5 py-3 rounded-full font-black text-white shadow-[0_4px_20px_rgba(0,0,0,0.5)] flex items-center gap-2 btn-press"
              style={{ background: 'var(--primary)', border: '1px solid var(--primary-glow)' }}>
              <Ic n="clock" size={16}/>
              <span>{fmtTime(timeLeft)}</span>
            </button>
          ) : !timerMinimized && (
            <button onClick={() => setTimerOpen(true)}
              className={`flex flex-col items-center justify-center rounded-[1.25rem] btn-press transition-all duration-300 ${timeLeft > 0 ? 'w-16 h-16 glow-pulse' : 'w-14 h-14'}`}
              style={{
                background: timeLeft > 0 ? 'linear-gradient(135deg, var(--primary), var(--bg))' : 'var(--surface)',
                border: `1px solid ${timeLeft > 0 ? 'var(--primary)' : 'var(--border)'}`,
                boxShadow: timeLeft > 0 ? '0 10px 25px var(--primary-glow)' : '0 4px 15px rgba(0,0,0,0.3)',
                color: timeLeft > 0 ? 'white' : 'var(--primary)',
                backdropFilter: 'blur(8px)',
              }}>
              {timeLeft > 0 ? (
                <>
                  <span className="text-lg font-black leading-none drop-shadow-sm">{timeLeft < 60 ? timeLeft : fmtTime(timeLeft)}</span>
                  <span className="text-[9px] font-bold uppercase mt-1 tracking-wider opacity-90">{timerOn ? 'פעיל' : 'מושהה'}</span>
                </>
              ) : (
                <Ic n="clock" size={26}/>
              )}
            </button>
          )}
        </div>
      )}

      {!manage && (
        <nav className="fixed bottom-0 left-0 w-full z-40 flex pb-safe" dir="rtl"
          style={{ background: 'rgba(6, 6, 10, 0.85)', borderTop: '1px solid var(--border)', backdropFilter: 'blur(20px)', paddingBottom: 'env(safe-area-inset-bottom)' }}>
          <div className="flex w-full max-w-lg mx-auto">
            {NAV.map(item => {
              const active = page === item.id && !workout;
              return (
                <button key={item.id} onClick={() => { navigate(item.id); if (manage) cancelManage(); }}
                  className="flex-1 py-4 flex flex-col items-center gap-1.5 transition-all btn-press"
                  style={{ color: active ? 'var(--primary)' : 'rgba(255,255,255,0.35)' }}>
                  <div className={`transition-transform duration-300 ${active ? 'scale-110 drop-shadow-[0_0_8px_var(--primary-glow)]' : ''}`}>
                    <Ic n={item.n} size={22}/>
                  </div>
                  <span className="text-[10px] font-bold tracking-wide">{item.label}</span>
                  {active && <div className="absolute top-0 w-8 h-0.5 rounded-b-full" style={{ background: 'var(--primary)', boxShadow: '0 2px 8px var(--primary-glow)' }}/>}
                </button>
              );
            })}
          </div>
        </nav>
      )}

      {manage && (
        <div className="fixed bottom-0 left-0 w-full p-4 z-[150] flex gap-3 slide-up pb-safe"
          style={{ background: 'rgba(6, 6, 10, 0.95)', borderTop: '1px solid var(--border)', backdropFilter: 'blur(15px)', paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}>
          <button onClick={saveManage} className="flex-1 p-4 rounded-2xl font-black flex items-center justify-center gap-2 btn-press text-white shadow-lg" style={{background: 'var(--primary)'}}>
            <Ic n="check" size={20}/> עדכון ושמירה
          </button>
          <button onClick={cancelManage} className="flex-1 p-4 rounded-2xl font-black flex items-center justify-center gap-2 btn-press bg-white/5 border border-white/10 text-gray-300">
            <Ic n="x" size={20}/> ביטול וסגירה
          </button>
        </div>
      )}

      {timerOpen && prefs.timer && (
        <div className="fixed inset-0 z-[100] flex items-end fade-in" style={{ background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(15px)' }}>
          <div className="w-full max-w-lg mx-auto rounded-t-[2.5rem] p-8 pb-12 slide-up" dir="rtl" style={{ background: 'var(--surface2)', borderTop: '1px solid var(--border)' }}>
            <div className="flex justify-between items-center mb-6">
              <button onClick={() => { setTimerOpen(false); setTimerMinimized(true); }} className="p-2 bg-white/10 rounded-full btn-press text-gray-300"><Ic n="minimize" size={20}/></button>
              <h3 className="text-xl font-black text-white">טיימר התאוששות</h3>
              <div className="w-10"></div>
            </div>
            
            <div className="text-center mb-10 mt-4">
              <span className={`text-8xl font-black transition-all duration-300 ${timerOn ? 'drop-shadow-lg scale-105' : 'opacity-50'}`} 
                    style={{ fontVariantNumeric: 'tabular-nums', color: timerOn ? 'var(--primary)' : 'var(--text)' }}>
                {fmtTime(timeLeft)}
              </span>
            </div>
            
            <div className="flex justify-center gap-3 mb-8 flex-wrap">
              {[30, 45, 60, 90, 120].map(s => (
                <button key={s} onClick={() => startTimer(s)}
                  className={`w-[70px] h-[70px] rounded-2xl flex flex-col items-center justify-center btn-press border transition-colors`}
                  style={{
                    background: timeLeft === s && timerOn ? 'var(--primary)' : 'rgba(0,0,0,0.3)',
                    borderColor: timeLeft === s && timerOn ? 'transparent' : 'var(--border)',
                    color: timeLeft === s && timerOn ? 'white' : 'var(--muted)',
                    boxShadow: timeLeft === s && timerOn ? '0 0 15px var(--primary-glow)' : 'none'
                  }}>
                  <span className="text-2xl font-black leading-none">{s < 60 ? s : s/60 + 'm'}</span>
                </button>
              ))}
            </div>
            
            <button onClick={stopTimer} className="w-full py-4 rounded-xl font-black btn-press flex items-center justify-center gap-2 bg-rose-500/10 text-rose-500 border border-rose-500/30">
              <Ic n="stop" size={20}/> עצור ואפס
            </button>
          </div>
        </div>
      )}

      {editEx && <ExerciseEditModal exercise={editEx} onSave={saveEx} onClose={() => setEditEx(null)} prefs={prefs} />}
      {selDate && <DayInfoModal dateInfo={selDate} onClose={() => setSelDate(null)} history={hist} categories={cats} schedule={sched} onUpdateStatus={updateHist} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
