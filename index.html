function useModalScrollLock() {
  useLayoutEffect(() => {
    const savedY = window.scrollY;
    const html = document.documentElement;
    const body = document.body;
    const prevHtmlOverflow = html.style.overflow;
    const prevBodyOverflow = body.style.overflow;

  try {

      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ctx.currentTime + i * 0.15;

};

function parseFirstWeight(wStr) {
  if (!wStr) return 0;
  const m = String(wStr).match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

function calc1RM(weightStr, reps) {
  const w = parseFirstWeight(weightStr);
  const r = parseInt(reps) || 0;
  if (w <= 0 || r <= 0) return 0;
  if (r === 1) return w;
  return Math.round(w * (1 + r / 30));
}

function calcCategoryMetrics(cat) {
  let totalSets = 0, doneSets = 0, totalVol = 0;
  (cat?.exercises || []).forEach(ex => {
    const numSets = parseInt(ex.sets) || 0;
    const baseReps = parseInt(ex.reps) || 0;
    const baseWeight = parseFirstWeight(ex.weight);
    totalSets += numSets;
    if (ex.setDetails && ex.setDetails.length > 0) {
      ex.setDetails.slice(0, numSets).forEach(sd => {
        if (sd.done) doneSets++;
        const r = parseInt(sd.reps) || baseReps;
        const w = sd.weight !== undefined && sd.weight !== '' ? parseFirstWeight(sd.weight) : baseWeight;
        totalVol += (r * w);
      });
    } else {
      totalVol += (numSets * baseReps * baseWeight);
    }
  });
  const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
  return { totalSets, doneSets, totalVol: Math.round(totalVol), pct };
}

function calcStats(history) {
  const safeHist = history && typeof history === 'object' ? history : {};
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  let streak = 0, d = new Date(today);
  
  if (!safeHist[todayStr] || safeHist[todayStr]?.status !== 'done') d.setDate(d.getDate() - 1);
  while (true) {
    const s = d.toISOString().split('T')[0];
    if (safeHist[s]?.status === 'done') { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  
  const entries = Object.entries(safeHist);
  const totalDone = entries.filter(([, r]) => r?.status === 'done').length;
  const mStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
  const monthDone = entries.filter(([dt, r]) => dt >= mStart && r?.status === 'done').length;
  const monthMissed = entries.filter(([dt, r]) => dt >= mStart && r?.status === 'missed').length;
  
  const weeks = [];
  for (let w = 7; w >= 0; w--) {
    const ws = new Date(today); ws.setDate(today.getDate() - (w * 7 + today.getDay()));
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    const wsS = ws.toISOString().split('T')[0], weS = we.toISOString().split('T')[0];
    weeks.push(entries.filter(([dt, r]) => dt >= wsS && dt <= weS && r?.status === 'done').length);
  }
  return { streak, totalDone, monthDone, monthMissed, weeks };
}

    while (details.length < numSets) {
      details.push({ reps: init.reps || 10, weight: init.weight || '', type: 'N', done: false });

    init.setDetails = details.slice(0, numSets);
    return init;

    const numSets = Math.max(0, Math.min(15, parseInt(val) || 0));

              </div>
              {timeLeft > 0 && (
                <div className="w-48 h-1.5 bg-white/10 rounded-full mx-auto mt-3 overflow-hidden">
                  <div className="h-full transition-all duration-500" style={{ width: `${pct}%`, background: 'var(--primary)' }}/>
                </div>
              )}
            </div>
            
            <div className="grid grid-cols-3 gap-2.5 mb-6">
              {[30, 45, 60, 90, 120, 180].map(s => (
                <button key={s} onClick={() => startTimer(s)}
                  className="py-3.5 rounded-2xl flex flex-col items-center justify-center btn-press border transition-all"
                  style={{
                    background: timeLeft === s && timerOn ? 'var(--primary)' : 'rgba(0,0,0,0.35)',
                    borderColor: timeLeft === s && timerOn ? 'var(--primary-2)' : 'var(--border)',
                    color: timeLeft === s && timerOn ? 'white' : 'var(--text)'
                  }}>
                  <span className="text-xl font-black leading-none">{s < 60 ? `${s} ש'` : `${s/60} דק'`}</span>
                </button>
              ))}
            </div>
            
            <div className="flex gap-3">
              {timeLeft > 0 && (
                <button onClick={() => setTimerOn(!timerOn)} className="flex-1 py-3.5 rounded-2xl font-black btn-press bg-white/10 text-white">
                  {timerOn ? 'השהה' : 'המשך'}
                </button>
              )}
              <button onClick={stopTimer} className="flex-1 py-3.5 rounded-2xl font-black btn-press flex items-center justify-center gap-2 bg-rose-500/15 text-rose-400 border border-rose-500/30">
                <Ic n="stop" size={18}/> איפוס ועצירה
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ══════════════ MAIN APPLICATION ══════════════ */
function App() {
  const [page, setPage] = useState('home');
  const [workout, setWorkout] = useState(null);
  const [showFullCal, setShowFullCal] = useState(false);
  const [isOffline, setIsOffline] = useState(!navigator.onLine);

  const getInitial = (key, def) => S.get(`wk_${VER}_${key}`, S.get(`wk_v31_${key}`, S.get(`wk_v30_${key}`, S.get(`wk_v29_${key}`, S.get(`wk_v28_${key}`, S.get(`wk_v27_${key}`, S.get(`wk_v26_${key}`, S.get(`wk_v25_${key}`, S.get(`wk_v16_${key}`, def)))))))));
  
  const [cats, setCats] = useState(() => {
    const c = getInitial('cats', null) || S.get('workout_v16_data', DEF_CATS);
    return Array.isArray(c) && c.length > 0 ? c : DEF_CATS;
  });
  const [hist, setHist] = useState(() => getInitial('hist', null) || S.get('workout_v16_history', {}));
  const [sched, setSched] = useState(() => getInitial('sched', DEF_SCHED));
  const [theme, setTheme] = useState(() => getInitial('theme', 'default'));
  const [prefs, setPrefs] = useState(() => ({ ...DEF_PREFS, ...getInitial('prefs', DEF_PREFS) }));
  const [bodyLogs, setBodyLogs] = useState(() => {
    const b = getInitial('bodyLogs', []);
    return Array.isArray(b) ? b : [];
  });
  const [habits, setHabits] = useState(() => getInitial('habits', {}) || {});
  const [newWeightInput, setNewWeightInput] = useState('');

  const [manage, setManage] = useState(false);
  const [draftCats, setDraftCats] = useState(null);
  const [editEx, setEditEx] = useState(null);
  const [editCatModal, setEditCatModal] = useState(null);
  const [copiedEx, setCopiedEx] = useState(null);

  const [calDate, setCalDate] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const [selDate, setSelDate] = useState(null);
  const fileRef = useRef(null);
  const scrollPositions = useRef({});
  
  const navigate = (newPage, newWorkout = null) => {
    scrollPositions.current[`${page}_${workout || 'main'}`] = window.scrollY;
    setPage(newPage);
    setWorkout(newWorkout);
  };

  useLayoutEffect(() => {
    const pos = scrollPositions.current[`${page}_${workout || 'main'}`] || 0;
    window.scrollTo(0, pos);
  }, [page, workout]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-cardstyle', prefs.cardStyle || 'bubble');
  }, [theme, prefs.cardStyle]);

  useEffect(() => { S.set(`wk_${VER}_cats`, cats); S.set(`wk_v31_cats`, cats); S.set(`wk_v29_cats`, cats); }, [cats]);
  useEffect(() => { S.set(`wk_${VER}_hist`, hist); S.set(`wk_v31_hist`, hist); S.set(`wk_v29_hist`, hist); }, [hist]);
  useEffect(() => { S.set(`wk_${VER}_sched`, sched); S.set(`wk_v31_sched`, sched); S.set(`wk_v29_sched`, sched); }, [sched]);
  useEffect(() => { S.set(`wk_${VER}_theme`, theme); S.set(`wk_v31_theme`, theme); S.set(`wk_v29_theme`, theme); }, [theme]);
  useEffect(() => { S.set(`wk_${VER}_prefs`, prefs); S.set(`wk_v31_prefs`, prefs); S.set(`wk_v29_prefs`, prefs); }, [prefs]);
  useEffect(() => { S.set(`wk_${VER}_bodyLogs`, bodyLogs); }, [bodyLogs]);
  useEffect(() => { S.set(`wk_${VER}_habits`, habits); }, [habits]);

  useEffect(() => {
    const onOnline = () => setIsOffline(false);
    const onOffline = () => setIsOffline(true);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => {
      window.removeEventListener('online', onOnline);
      window.removeEventListener('offline', onOffline);
    };
  }, []);

  const today = new Date();
  const todayKey = today.toISOString().split('T')[0];
  const dayName = today.toLocaleDateString('he-IL', { weekday: 'long' });
  const planned = useMemo(() => cats.find(c => c.id === sched[today.getDay()]), [cats, sched, today.getDay()]);
  const stats = useMemo(() => calcStats(hist), [hist]);
  
  const dispCats = manage ? draftCats : cats;

  const enterManage = () => { setDraftCats(JSON.parse(JSON.stringify(cats))); setManage(true); };
  const saveManage = () => { setCats(draftCats); setManage(false); setDraftCats(null); };
  const cancelManage = () => { setManage(false); setDraftCats(null); };

  const addCat = () => {
    const newCat = { id: uid(), name: 'תוכנית חדשה', hex: '#8b5cf6', icon: 'dumbbell', exercises: [] };
    setDraftCats([...draftCats, newCat]);
    setEditCatModal({ index: draftCats.length, data: newCat });
  };
  const delCat = (i) => {
    if (confirm(`למחוק את התוכנית "${draftCats[i].name}"?`)) {
      const a = [...draftCats]; a.splice(i, 1); setDraftCats(a);
    }
  };
  const moveCat = (i, dir) => {
    const a = [...draftCats], j = i + dir;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; setDraftCats(a);
  };

  const addEx = () => {
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    const ex = { id: uid(), name: 'תרגיל חדש', sets: 3, reps: 10, weight: '20', notes: '', setDetails: [{reps:10, weight:'20', type:'N', done:false},{reps:10, weight:'20', type:'N', done:false},{reps:10, weight:'20', type:'N', done:false}] };
    a[ci] = { ...a[ci], exercises: [...(a[ci].exercises || []), ex] }; setDraftCats(a); setEditEx(ex);
  };
  
  const delEx = (id) => {
    if (confirm('למחוק תרגיל זה מהרשימה?')) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: (a[ci].exercises || []).filter(e => e.id !== id) }; setDraftCats(a);
    }
  };

  const moveEx = (i, dir) => {
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    const exs = [...(a[ci].exercises || [])], j = i + dir;
    if (j < 0 || j >= exs.length) return;
    [exs[i], exs[j]] = [exs[j], exs[i]]; a[ci] = { ...a[ci], exercises: exs }; setDraftCats(a);
  };

  const saveEx = (upd) => {
    if (manage) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: (a[ci].exercises || []).map(e => e.id === upd.id ? upd : e) }; setDraftCats(a);
    } else {
      const a = [...cats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: (a[ci].exercises || []).map(e => e.id === upd.id ? upd : e) }; setCats(a);
    }
    setEditEx(null);
  };

  const toggleQuickSet = (exId, setIdx) => {
    const a = [...cats];
    const ci = a.findIndex(c => c.id === workout);
    if (ci === -1) return;
    const exs = [...(a[ci].exercises || [])];
    const ei = exs.findIndex(e => e.id === exId);
    if (ei === -1) return;
    const ex = { ...exs[ei] };
    const numSets = parseInt(ex.sets) || 0;
    const details = [...(ex.setDetails || [])];
    while (details.length < numSets) {
      details.push({ reps: ex.reps || 10, weight: ex.weight || '', type: 'N', done: false });
    }
    details[setIdx] = { ...details[setIdx], done: !details[setIdx].done };
    ex.setDetails = details;
    exs[ei] = ex;
    a[ci] = { ...a[ci], exercises: exs };
    setCats(a);
  };

  const resetWorkoutSets = (catId) => {
    const a = [...cats];
    const ci = a.findIndex(c => c.id === catId);
    if (ci === -1) return;
    a[ci] = {
      ...a[ci],
      exercises: (a[ci].exercises || []).map(ex => ({
        ...ex,
        setDetails: (ex.setDetails || []).map(sd => ({ ...sd, done: false }))
      }))
    };
    setCats(a);
  };

  const copyExercise = (ex) => { setCopiedEx(ex); alert('התרגיל הועתק! כעת ניתן להדביק אותו בכל תוכנית אימון.'); };
  const pasteExercise = () => {
    if (!copiedEx) return;
    const newEx = { ...copiedEx, id: uid() };
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    a[ci] = { ...a[ci], exercises: [...(a[ci].exercises || []), newEx] };
    setDraftCats(a);
  };

  const updateHist = useCallback((dateStr, status, catId) => {
    setHist(prev => {
      const h = { ...prev };
      if (!status) delete h[dateStr];
      else h[dateStr] = { type: catId, status };
      return h;
    });
  }, []);

  const todayHabit = habits[todayKey] || { water: 0, creatine: false, protein: false };
  const updateTodayHabit = (field, val) => {
    setHabits(prev => ({
      ...prev,
      [todayKey]: { ...(prev[todayKey] || { water: 0, creatine: false, protein: false }), [field]: val }
    }));
  };

  const addBodyWeight = () => {
    const w = parseFloat(newWeightInput);
    if (!w || w <= 0) return;
    const entry = { date: todayKey, weight: w };
    setBodyLogs(prev => [...prev.filter(x => x.date !== todayKey), entry].sort((a,b) => a.date.localeCompare(b.date)));
    setNewWeightInput('');
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ cats, hist, sched, theme, prefs, bodyLogs, habits }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `Workout_Pro_Backup_${todayKey}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.cats) setCats(d.cats); if (d.hist) setHist(d.hist); if (d.sched) setSched(d.sched);
        if (d.theme) setTheme(d.theme); if (d.prefs) setPrefs(d.prefs);
        if (d.bodyLogs) setBodyLogs(d.bodyLogs); if (d.habits) setHabits(d.habits);
        alert('כל הנתונים שוחזרו בהצלחה!');
      } catch { alert('קובץ גיבוי לא תקין.'); }
    };
    r.readAsText(file); e.target.value = '';
  };

  const forceServerRefresh = async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e) {}
    window.location.reload(true);
  };

  /* ── WEEKLY STRIP & FULL CALENDAR ── */
  const renderWeeklyStrip = () => {
    if (!prefs.calendar) return null;
    const currWeekStart = new Date(today);
    currWeekStart.setDate(today.getDate() - today.getDay());
    const weekDays = [...Array(7)].map((_, i) => {
      const d = new Date(currWeekStart);
      d.setDate(currWeekStart.getDate() + i);
      return d;
    });

    return (
      <div className="bento-card p-4" dir="rtl">
        <div className="flex justify-between items-center mb-3 px-1">
          <div className="flex items-center gap-2">
            <Ic n="calendar" size={16} style={{color: 'var(--primary-2)'}}/>
            <span className="text-xs font-black text-white">מעקב השבוע</span>
          </div>
          <button onClick={() => setShowFullCal(!showFullCal)} className="text-[11px] font-bold px-3 py-1.5 rounded-xl bg-white/10 text-gray-200 btn-press">
            {showFullCal ? 'הסתר חודש מלא' : 'לוח חודשי מלא'}
          </button>
        </div>

        <div className="grid grid-cols-7 gap-1.5">
          {weekDays.map((d, i) => {
            const ds = d.toISOString().split('T')[0];
            const rec = hist[ds];
            const pl = cats.find(c => c.id === sched[i]);
            const isToday = ds === todayKey;
            let bg = 'rgba(255,255,255,0.03)', border = '1px solid rgba(255,255,255,0.05)', col = 'var(--text)';
            if (rec?.status === 'done') {
              bg = cats.find(c => c.id === rec.type)?.hex || 'var(--primary)';
              border = '1px solid transparent'; col = '#fff';
            } else if (rec?.status === 'missed') {
              bg = 'rgba(244,63,94,0.22)'; border = '1px solid rgba(244,63,94,0.45)'; col = '#fb7185';
            } else if (isToday) {
              bg = 'var(--primary-glow)'; border = '1.5px solid var(--primary)'; col = '#fff';
            }

            return (
              <button key={ds} onClick={() => setSelDate({ date: d })}
                className="py-2.5 rounded-2xl flex flex-col items-center justify-center gap-1 btn-press transition-all"
                style={{ background: bg, border, color: col }}>
                <span className="text-[10px] font-bold opacity-75">{DAY_LET[i]}</span>
                <span className="text-sm font-black leading-none">{d.getDate()}</span>
                <div className="h-2 flex items-center justify-center">
                  {rec?.status === 'done' ? <Ic n="check" size={11}/> : rec?.status === 'missed' ? <Ic n="x" size={11}/> : pl ? <span className="w-1.5 h-1.5 rounded-full" style={{backgroundColor: pl.hex}}/> : null}
                </div>
              </button>
            );
          })}
        </div>

        {showFullCal && renderFullCalendar()}

    const firstDay = new Date(calDate.getFullYear(), calDate.getMonth(), 1).getDay();
    const mName = calDate.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
    
    return (
      <div className="mt-4 pt-4 border-t border-white/10 fade-in" dir="rtl">

          <button onClick={() => setCalDate(new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1))} className="p-2.5 rounded-xl btn-press bg-white/10 text-gray-200"><Ic n="chevR" size={16}/></button>

          <button onClick={() => setCalDate(new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1))} className="p-2.5 rounded-xl btn-press bg-white/10 text-gray-200"><Ic n="chevL" size={16}/></button>
        </div>
        <div className="grid grid-cols-7 gap-1.5 text-center">
          {DAY_LET.map(d => <div key={d} className="text-[10px] font-bold pb-1 text-gray-500">{d}</div>)}

            const dn = i + 1;
            const cd = new Date(calDate.getFullYear(), calDate.getMonth(), dn);
            const ds = cd.toISOString().split('T')[0];
            const rec = hist[ds];
            const pl = cats.find(c => c.id === sched[cd.getDay()]);
            const isToday = ds === todayKey;
            let bg = 'rgba(255,255,255,0.025)', border = '1px solid transparent', txtCol = 'var(--text)', ico = null;
            if (rec) {
              if (rec.status === 'done') {
                bg = cats.find(c => c.id === rec.type)?.hex || pl?.hex || '#3b82f6';

              } else {
                bg = 'rgba(244,63,94,0.28)'; border = '1px solid rgba(244,63,94,0.5)'; txtCol = '#fb7185'; ico = <Ic n="x" size={11}/>;
              }
            } else if (isToday) {
              border = '1.5px solid var(--primary)'; txtCol = 'var(--primary-2)'; bg = 'var(--primary-glow)';
            } else if (cd > today) {
              txtCol = 'rgba(255,255,255,0.25)';
            }
            return (
              <div key={dn} onClick={() => setSelDate({ date: cd })}
                className="aspect-square flex flex-col items-center justify-center rounded-xl cursor-pointer btn-press text-xs font-bold"
                style={{ backgroundColor: bg, border, color: txtCol }}>
                {dn}
                <div className="mt-0.5 min-h-[10px]">
                  {ico || (pl && !rec && <div className="w-1.5 h-1.5 rounded-full opacity-80" style={{ backgroundColor: pl.hex }}/>)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  /* ── HOME DASHBOARD ── */
  const renderHome = () => {
    const plannedMetrics = planned ? calcCategoryMetrics(planned) : null;

    return (
      <div className="flex flex-col gap-4 px-4 pb-32 safe-top" dir="rtl">
        <div className="flex justify-between items-center px-1">
          <div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-gray-400">יום {dayName}</span>
              {isOffline && (
                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                  <Ic n="wifiOff" size={11}/> אופליין
                </span>
              )}
            </div>
            <h1 className="text-2xl font-black text-white tracking-tight">האימונים שלי</h1>
          </div>

          <div className="flex items-center gap-2">
            <div className="px-3.5 py-2.5 rounded-2xl bg-orange-500/10 border border-orange-500/25 flex items-center gap-1.5">
              <Ic n="flame" size={17} style={{color: '#f97316'}}/>
              <span className="text-xs font-black text-orange-400">{stats.streak} ימים</span>
            </div>
            <button onClick={enterManage} className="px-4 py-2.5 rounded-2xl btn-press bg-white/10 border border-white/15 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm">
              <Ic n="edit" size={17}/> <span>עריכה</span>
            </button>
          </div>
        </div>

        {renderWeeklyStrip()}

        <div className="bento-card-elevated p-5 relative overflow-hidden">
          <div className="absolute -top-12 -left-12 w-36 h-36 rounded-full blur-2xl pointer-events-none" style={{background: planned ? planned.hex : 'var(--primary)', opacity: 0.22}}/>
          <div className="flex justify-between items-start relative z-10">
            <div>
              <span className="text-[11px] font-black uppercase tracking-wider px-2.5 py-1 rounded-lg bg-white/10 text-gray-200">
                האימון המתוכנן להיום
              </span>
              <h2 className="text-3xl font-black text-white mt-2.5">{planned ? planned.name : 'יום מנוחה והתאוששות'}</h2>
              {planned && plannedMetrics && (
                <p className="text-xs text-gray-400 mt-1 font-medium">
                  {(planned.exercises || []).length} תרגילים • {plannedMetrics.totalSets} סטים • נפח ~{plannedMetrics.totalVol.toLocaleString()} ק"ג
                </p>
              )}
            </div>
            {planned && (
              <div className="w-12 h-12 rounded-2xl flex items-center justify-center bg-black/40 border border-white/10" style={{color: planned.hex}}>
                <Ic n={planned.icon} size={24}/>
              </div>
            )}
          </div>

          {planned && plannedMetrics && (
            <div className="mt-4 relative z-10">
              <div className="flex justify-between text-[11px] font-bold text-gray-300 mb-1.5">
                <span>התקדמות סטים באימון</span>
                <span>{plannedMetrics.doneSets}/{plannedMetrics.totalSets} ({plannedMetrics.pct}%)</span>
              </div>
              <div className="h-2 rounded-full bg-black/40 overflow-hidden mb-4">
                <div className="h-full rounded-full transition-all duration-500" style={{width: `${plannedMetrics.pct}%`, backgroundColor: planned.hex}}/>
              </div>
              <button onClick={() => navigate('home', planned.id)} className="w-full py-3.5 rounded-2xl font-black text-white flex items-center justify-center gap-2 btn-press shadow-lg" style={{ background: planned.hex }}>

          </div>

          <div className={manage ? "space-y-3" : "grid grid-cols-2 gap-3"}>
            {(manage ? draftCats : cats).map((cat, i) => {

                return (
                  <div key={cat.id} className="flex items-center gap-2">
                    <div className="flex flex-col gap-1">
                      <button onClick={() => moveCat(i, -1)} className="p-2 rounded-xl btn-press bg-white/10 text-gray-200"><Ic n="arrowUp" size={15}/></button>
                      <button onClick={() => moveCat(i, 1)} className="p-2 rounded-xl btn-press bg-white/10 text-gray-200"><Ic n="arrowDown" size={15}/></button>
