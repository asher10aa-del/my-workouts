const playBeep = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = [523, 659, 784];
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.35);
    });
  } catch(e) { console.warn("Audio Context blocked", e); }
};

function calcStats(history) {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  let streak = 0, d = new Date(today);
  
  if (!history[todayStr] || history[todayStr]?.status !== 'done') d.setDate(d.getDate() - 1);
  while (true) {
    const s = d.toISOString().split('T')[0];
    if (history[s]?.status === 'done') { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  
  const entries = Object.entries(history);
  const totalDone = entries.filter(([, r]) => r.status === 'done').length;
  const mStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
  const monthDone = entries.filter(([d, r]) => d >= mStart && r.status === 'done').length;
  const monthMissed = entries.filter(([d, r]) => d >= mStart && r.status === 'missed').length;
  
  const weeks = [];
  for (let w = 7; w >= 0; w--) {
    const ws = new Date(today); ws.setDate(today.getDate() - (w * 7 + today.getDay()));
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    const wsS = ws.toISOString().split('T')[0], weS = we.toISOString().split('T')[0];
    weeks.push(entries.filter(([d, r]) => d >= wsS && d <= weS && r.status === 'done').length);
  }
  return { streak, totalDone, monthDone, monthMissed, weeks };
}

  };

  const stats = useMemo(() => calcStats(hist), [hist]);
  
  const dispCats = manage ? draftCats : cats;

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ cats, hist, sched, theme }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `Fitness_Data_${todayKey}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.cats) setCats(d.cats); if (d.hist) setHist(d.hist); if (d.sched) setSched(d.sched); if (d.theme) setTheme(d.theme);
        alert('הנתונים שוחזרו בהצלחה מהגיבוי.');
        setSettingsOpen(false);
      } catch { alert('קובץ שגוי.'); }
    };
    r.readAsText(file); e.target.value = '';
  };

  const saveEx = (upd) => {
    if (manage) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.map(e => e.id === upd.id ? upd : e) }; setDraftCats(a);
    } else {
      const a = [...cats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.map(e => e.id === upd.id ? upd : e) }; setCats(a);
    }
    setEditEx(null);
  };

  const renderWorkoutDetail = () => {
    const cat = dispCats.find(c => c.id === workout);
    if (!cat) return null;
    
    return (
      <div className="p-5 pb-32 fade-in" dir="rtl">
        <div className="flex justify-between items-center mt-6 mb-8 px-1">
          <button onClick={() => setWorkout(null)} className="flex items-center gap-2 btn-press text-gray-400 bg-white/5 px-4 py-2 rounded-xl">
            <Ic n="chevR" size={20}/><span className="font-bold text-sm">חזור</span>
          </button>
          {!manage ? (
            <button onClick={() => { setDraftCats(JSON.parse(JSON.stringify(cats))); setManage(true); }} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-300">
              <Ic n="edit" size={20}/>
            </button>
          ) : (
            <div className="flex gap-2">
              <button onClick={() => { setCats(draftCats); setManage(false); }} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm">שמור</button>
              <button onClick={() => setManage(false)} className="px-4 py-2 rounded-xl bg-white/10 text-gray-300 font-bold text-sm">בטל</button>
            </div>
          )}
        </div>

        <h2 className="text-4xl font-black text-white mb-6 px-2">{cat.name}</h2>

        <div className="space-y-4">
          {cat.exercises.map((ex, idx) => (
            <div key={ex.id} className={`p-5 rounded-2xl relative overflow-hidden transition-colors btn-press ${manage ? 'bg-blue-500/10 border border-blue-500/30' : 'card'}`}
                 onClick={() => setEditEx(ex)}>
              <div className="absolute top-0 right-0 w-1.5 h-full opacity-60 rounded-l-full" style={{ backgroundColor: cat.hex }}/>
              <div className="pr-3">
                <h4 className="font-black text-lg mb-2 text-white">{ex.name}</h4>
                <div className="flex gap-5 text-sm mb-2">
                  <span className="text-gray-400 font-bold">{ex.sets} <span className="text-[10px]">סטים</span></span>
                  <span className="text-gray-400 font-bold">{ex.reps} <span className="text-[10px]">חזרות</span></span>
                  <span className="font-black drop-shadow-sm" style={{ color: cat.hex }}>{ex.weight} <span className="text-[10px]">ק"ג</span></span>
                </div>
                {ex.notes && <p className="text-xs text-gray-500 italic bg-black/20 p-2 rounded-lg inline-block border border-white/5">{ex.notes}</p>}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const fmtTime = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;

  return (
    <div className="min-h-screen relative">
      <main className="relative z-10 max-w-lg mx-auto min-h-screen">
        {workout ? renderWorkoutDetail() : (
          <div className="flex flex-col gap-5 p-5 pb-28 slide-up" dir="rtl">
            <div className="flex justify-between items-center mt-6 px-1">
              <h1 className="text-2xl font-black text-white">האימונים שלי</h1>
              <button onClick={() => setSettingsOpen(true)} className="p-3 rounded-2xl btn-press bg-white/5 border border-white/10 text-gray-300">
                <Ic n="settings" size={20}/>
              </button>
            </div>
            
            <div className="card p-6 border-l-4 border-l-blue-500 relative overflow-hidden">
              <p className="text-xs font-bold uppercase mb-1 text-gray-400">{dayName}, מתוכנן להיום:</p>
              <p className="text-3xl font-black text-white">{planned?.name || 'מנוחה'}</p>
              {planned && (
                <button onClick={() => setWorkout(planned.id)} className="mt-4 w-full py-3 rounded-xl font-bold bg-blue-600 text-white flex items-center justify-center gap-2">
                  <Ic n="arrowLeft" size={18}/> התחל אימון
                </button>
              )}
            </div>

            <div className="grid gap-3">
              <h3 className="text-sm font-black text-gray-300 mt-2">כל האימונים</h3>
              {cats.map(cat => (
                <button key={cat.id} onClick={() => setWorkout(cat.id)} className="card p-5 rounded-2xl btn-press flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <span className="p-3 rounded-xl bg-black/40" style={{ color: cat.hex }}><Ic n={cat.icon} size={22}/></span>
                    <span className="text-lg font-black text-white">{cat.name}</span>
                  </div>
                  <Ic n="arrowLeft" size={20} style={{ color: 'rgba(255,255,255,0.2)' }}/>
                </button>
              ))}
            </div>
          </div>
        )}
      </main>

      {/* FLOATING TIMER (MINIMIZED) */}
      {timerMinimized && timeLeft > 0 && !timerOpen && (
        <div className="fixed z-50 bottom-24 right-5 slide-up">
          <button onClick={() => { setTimerMinimized(false); setTimerOpen(true); }}
            className="px-5 py-3 rounded-full font-black text-white bg-blue-600 shadow-[0_4px_20px_rgba(59,130,246,0.5)] flex items-center gap-2 btn-press border border-blue-400">
            <Ic n="clock" size={16}/>
            <span>{fmtTime(timeLeft)}</span>
          </button>
        </div>
      )}

      {/* FULLSCREEN TIMER MODAL */}
      {timerOpen && (
        <div className="fixed inset-0 z-[100] flex items-end fade-in" style={{ background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(15px)' }}>
          <div className="w-full rounded-t-[2.5rem] p-8 pb-12 slide-up" dir="rtl" style={{ background: 'var(--surface2)', borderTop: '1px solid var(--border)' }}>
            <div className="flex justify-between items-center mb-6">
              <button onClick={() => { setTimerOpen(false); setTimerMinimized(true); }} className="p-2 bg-white/10 rounded-full btn-press text-gray-300"><Ic n="minimize" size={20}/></button>
              <h3 className="text-xl font-black text-white">טיימר התאוששות</h3>
              <div className="w-10"></div>
            </div>
            
            <div className="text-center mb-10 mt-4">
              <span className={`text-8xl font-black ${timerOn ? 'text-blue-500 drop-shadow-[0_0_20px_rgba(59,130,246,0.6)]' : 'text-gray-500'}`} style={{ fontVariantNumeric: 'tabular-nums' }}>
                {fmtTime(timeLeft)}
              </span>
            </div>
            
            <div className="flex justify-center gap-3 mb-8 flex-wrap">
              {[30, 45, 60, 90, 120].map(s => (
                <button key={s} onClick={() => startTimer(s)}
                  className={`w-[70px] h-[70px] rounded-2xl flex flex-col items-center justify-center btn-press border transition-colors ${timeLeft === s && timerOn ? 'bg-blue-600 border-blue-400 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]' : 'bg-black/30 border-white/10 text-gray-400'}`}>
                  <span className="text-2xl font-black leading-none">{s < 60 ? s : s/60 + 'm'}</span>
                </button>
              ))}
            </div>
            
            <button onClick={stopTimer} className="w-full py-4 rounded-xl font-black btn-press flex items-center justify-center gap-2 bg-rose-500/10 text-rose-500 border border-rose-500/30">
              <Ic n="stop" size={20}/> עצור ואפס
            </button>
          </div>
        </div>
      )}

      {/* MODALS */}
      {editEx && <ExerciseEditModal exercise={editEx} onSave={saveEx} onClose={() => setEditEx(null)} />}
      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} cats={cats} sched={sched} setSched={setSched} importData={importData} exportData={exportData} theme={theme} setTheme={setTheme} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
