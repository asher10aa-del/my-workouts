// תוקן: פונקציה גלובלית רגילה כדי לא לקרוס עם שגיאת React Hooks
const playBeep = (done = false) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = done ? [523, 659, 784] : [880, 880];
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = done ? 'sine' : 'square';
      const t = ctx.currentTime + i * (done ? 0.18 : 0.05);
      g.gain.setValueAtTime(done ? 0.25 : 0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (done ? 0.35 : 0.15));
      o.start(t); o.stop(t + (done ? 0.35 : 0.15));
    });
  } catch(e) { console.warn("Audio Context blocked", e); }
};

/* ── STATS CALCULATION ── */
function calcStats(history) {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  let streak = 0, d = new Date(today);
  
  if (!history[todayStr] || history[todayStr]?.status !== 'done') d.setDate(d.getDate() - 1);
  
  while (true) {
    const s = d.toISOString().split('T')[0];
    if (history[s]?.status === 'done') { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  
  const entries = Object.entries(history);
  const totalDone = entries.filter(([, r]) => r.status === 'done').length;
  const mStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
  const monthDone = entries.filter(([d, r]) => d >= mStart && r.status === 'done').length;
  const monthMissed = entries.filter(([d, r]) => d >= mStart && r.status === 'missed').length;
  
  const weeks = [];
  for (let w = 7; w >= 0; w--) {
    const ws = new Date(today); ws.setDate(today.getDate() - (w * 7 + today.getDay()));
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    const wsS = ws.toISOString().split('T')[0], weS = we.toISOString().split('T')[0];
    weeks.push(entries.filter(([d, r]) => d >= wsS && d <= weS && r.status === 'done').length);
  }
  return { streak, totalDone, monthDone, monthMissed, weeks };
}

            {categories.map(c => <option key={c.id} value={c.id}>{c.name}{c.id === plannedId ? ' (מתוכנן)' : ''}</option>)}
          </select>
        </div>
        
        <div className="flex gap-3 mb-4">
          <button onClick={() => onUpdateStatus(dateStr, 'done', selId)}
            className={`flex-1 p-4 rounded-xl font-black flex flex-col items-center gap-1.5 btn-press transition-all ${record?.status === 'done' ? 'text-white' : 'text-emerald-400'}`}
            style={{ background: record?.status === 'done' ? '#059669' : 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.3)' }}>
            <Ic n="check" size={22}/><span className="text-xs">בוצע בהצלחה</span>
          </button>
          <button onClick={() => onUpdateStatus(dateStr, 'missed', selId)}
            className={`flex-1 p-4 rounded-xl font-black flex flex-col items-center gap-1.5 btn-press transition-all ${record?.status === 'missed' ? 'text-white' : 'text-rose-400'}`}
            style={{ background: record?.status === 'missed' ? '#e11d48' : 'rgba(244,63,94,0.1)', border: '1px solid rgba(244,63,94,0.3)' }}>
            <Ic n="x" size={22}/><span className="text-xs">דולג / מנוחה</span>
          </button>
        </div>
        {record && (
          <button onClick={() => onUpdateStatus(dateStr, null, null)}
            className="w-full p-3.5 rounded-xl font-bold btn-press mt-2 text-sm"
            style={{ background: 'rgba(255,255,255,0.05)', color: 'var(--muted)' }}>
            איפוס רישום ליום זה
          </button>
        )}
      </div>
    </div>
  );
}

/* ══════════════ MAIN APPLICATION ══════════════ */
function App() {
  const [page, setPage] = useState('home');
  const [workout, setWorkout] = useState(null);
  const [cats, setCats] = useState(() => S.get(`wk_${VER}_cats`, DEF_CATS));
  const [hist, setHist] = useState(() => S.get(`wk_${VER}_hist`, {}));
  const [sched, setSched] = useState(() => S.get(`wk_${VER}_sched`, DEF_SCHED));

  const [manage, setManage] = useState(false);
  const [draftCats, setDraftCats] = useState(null);
  const [editEx, setEditEx] = useState(null);

  const [timeLeft, setTimeLeft] = useState(0);
  const [timerOn, setTimerOn] = useState(false);
  const [timerOpen, setTimerOpen] = useState(false);

  const [calDate, setCalDate] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const [selDate, setSelDate] = useState(null);
  const [motoIdx] = useState(() => Math.floor(Math.random() * MOTIVATIONS.length));
  const fileRef = useRef(null);

  // Persistence
  useEffect(() => S.set(`wk_${VER}_cats`, cats), [cats]);
  useEffect(() => S.set(`wk_${VER}_hist`, hist), [hist]);
  useEffect(() => S.set(`wk_${VER}_sched`, sched), [sched]);

  // Timer Logic
  useEffect(() => {
    let iv;
    if (timerOn && timeLeft > 0) {
      iv = setInterval(() => setTimeLeft(t => t - 1), 1000);
    } else if (timerOn && timeLeft === 0) {
      setTimerOn(false);
      playBeep(true);
    }
    return () => clearInterval(iv);
  }, [timerOn, timeLeft]); // תוקן: הורדנו את playBeep מכאן כדי למנוע קריסה

  const startTimer = useCallback((s) => {
    setTimeLeft(s);
    setTimerOn(true);
    setTimerOpen(false);
  }, []);

  const today = new Date();
  const todayKey = today.toISOString().split('T')[0];
  const dayName = today.toLocaleDateString('he-IL', { weekday: 'long' });
  
  // Memoized computations for performance
  const stats = useMemo(() => calcStats(hist), [hist]);
  const planned = useMemo(() => cats.find(c => c.id === sched[today.getDay()]), [cats, sched, today.getDay()]);

  // Management Handlers
  const enterManage = () => { setDraftCats(JSON.parse(JSON.stringify(cats))); setManage(true); };
  const saveManage = () => { setCats(draftCats); setManage(false); setDraftCats(null); };
  const cancelManage = () => { setManage(false); setDraftCats(null); };
  const dispCats = manage ? draftCats : cats;

  const moveCat = (i, dir) => {
    const a = [...draftCats], j = i + dir;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; setDraftCats(a);
  };
  const addCat = () => {
    const name = prompt('שם תוכנית האימון החדשה:');
    if (name) setDraftCats([...draftCats, { id: crypto.randomUUID(), name, hex: '#a855f7', icon: 'dumbbell', exercises: [] }]);
  };
  const delCat = (i) => {
    if (confirm(`האם ברצונך למחוק את "${draftCats[i].name}" לחלוטין?`)) {
      const a = [...draftCats]; a.splice(i, 1); setDraftCats(a);
    }
  };
  const renameCat = (i) => {
    const n = prompt('שם התוכנית החדש:', draftCats[i].name);
    if (n) { const a = [...draftCats]; a[i] = { ...a[i], name: n }; setDraftCats(a); }
  };
  
  const moveEx = (i, dir) => {
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    const exs = [...a[ci].exercises], j = i + dir;
    if (j < 0 || j >= exs.length) return;
    [exs[i], exs[j]] = [exs[j], exs[i]]; a[ci] = { ...a[ci], exercises: exs }; setDraftCats(a);
  };
  const addEx = () => {
    const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
    const ex = { id: crypto.randomUUID(), name: 'הזן תרגיל חדש', sets: 3, reps: 10, weight: '0' };
    a[ci] = { ...a[ci], exercises: [...a[ci].exercises, ex] }; setDraftCats(a); setEditEx(ex);
  };
  const delEx = (id) => {
    if (confirm('מחיקת תרגיל זה מהרשימה?')) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.filter(e => e.id !== id) }; setDraftCats(a);
    }
  };
  const saveEx = (upd) => {
    if (manage) {
      const a = [...draftCats], ci = a.findIndex(c => c.id === workout);
      a[ci] = { ...a[ci], exercises: a[ci].exercises.map(e => e.id === upd.id ? upd : e) }; setDraftCats(a);
    }
    setEditEx(null);
  };

  const updateHist = useCallback((dateStr, status, catId) => {
    setHist(prev => {
      const h = { ...prev };
      if (!status) delete h[dateStr];
      else h[dateStr] = { type: catId, status };
      return h;
    });
    setSelDate(null);
  }, []);

  // I/O Methods
  const exportData = () => {
    const blob = new Blob([JSON.stringify({ cats, hist, sched, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `Fitness_Data_${todayKey}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importData = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.cats) setCats(d.cats);
        if (d.hist) setHist(d.hist);
        if (d.sched) setSched(d.sched);
        alert('הנתונים שוחזרו בהצלחה מהגיבוי.');
      } catch { alert('קובץ שגוי. אנא ודא כי זהו קובץ הגיבוי המקורי.'); }
    };
    r.readAsText(file); e.target.value = '';
  };
  const resetAll = () => {
    if (confirm('אזהרה: פעולה זו תמחק את כל היסטוריית האימונים ותאפס להגדרות יצרן. להמשיך?')) {
      setCats(DEF_CATS); setHist({}); setSched(DEF_SCHED); alert('מערכת אופסה בהצלחה.');
    }
  };

  /* ── RENDERERS ── */
  const renderCal = useMemo(() => {
    const dim = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 0).getDate();
    const firstDay = new Date(calDate.getFullYear(), calDate.getMonth(), 1).getDay();
    const mName = calDate.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
    
    return (
      <div className="card p-6 mt-2" dir="rtl">
        <div className="flex justify-between items-center mb-5 px-1">
          <button onClick={() => setCalDate(new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1))}
            className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400 hover:text-white transition-colors">
            <Ic n="chevR" size={18}/>
          </button>
          <span className="font-black text-lg tracking-wide text-white">{mName}</span>
          <button onClick={() => setCalDate(new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1))}
            className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400 hover:text-white transition-colors">
            <Ic n="chevL" size={18}/>
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1.5 text-center">
          {DAY_LET.map(d => <div key={d} className="text-xs font-bold pb-2 text-gray-500">{d}</div>)}
          {[...Array(firstDay)].map((_, i) => <div key={`e${i}`}/>)}
          {[...Array(dim)].map((_, i) => {
            const dn = i + 1;
            const cd = new Date(calDate.getFullYear(), calDate.getMonth(), dn);
            const ds = cd.toISOString().split('T')[0];
            const rec = hist[ds];
            const pl = cats.find(c => c.id === sched[cd.getDay()]);
            const isToday = dn === today.getDate() && calDate.getMonth() === today.getMonth() && calDate.getFullYear() === today.getFullYear();
            
            let bg = 'rgba(255,255,255,0.02)', border = '1px solid transparent', txtCol = 'var(--text)', ico = null;
            if (rec) {
              if (rec.status === 'done') {
                bg = cats.find(c => c.id === rec.type)?.hex || pl?.hex || '#3b82f6';
                txtCol = 'white'; ico = <Ic n="check" size={12}/>;
              } else {
                bg = 'rgba(244,63,94,0.3)'; border = '1px solid rgba(244,63,94,0.5)'; txtCol = '#fb7185'; ico = <Ic n="x" size={12}/>;
              }
            } else if (isToday) {
              border = '2px solid var(--blue)'; txtCol = 'var(--blue)'; bg = 'rgba(59,130,246,0.1)';
            } else if (cd > today) {
               txtCol = 'rgba(255,255,255,0.2)';
            }

            return (
              <div key={dn} onClick={() => setSelDate({ date: cd })}
                className="aspect-square flex flex-col items-center justify-center rounded-[10px] cursor-pointer btn-press text-xs font-bold transition-all hover:scale-105"
                style={{ backgroundColor: bg, border: border, color: txtCol }}>
                {dn}
                <div className="mt-0.5 min-h-[12px]">
                  {ico || (pl && !rec && <div className="w-1.5 h-1.5 rounded-full opacity-70" style={{ backgroundColor: pl.hex }}/>)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }, [calDate, hist, cats, sched, today.getMonth(), today.getFullYear(), today.getDate()]);

  const renderHome = () => (
    <div className="flex flex-col gap-5 p-5 pb-28 slide-up" dir="rtl">
      <div className="flex justify-between items-center mt-6 px-1">
        <div className="flex-1">
          <p className="text-sm font-medium text-gray-400 mb-1">ברוך שובך,</p>
          <p className="text-xs font-bold italic leading-relaxed text-blue-400 opacity-90 pr-1">
            "{MOTIVATIONS[motoIdx]}"
          </p>
        </div>
        <button onClick={enterManage} className="p-3.5 rounded-2xl flex-shrink-0 ml-2 btn-press border border-white/10" style={{ background: 'var(--surface2)', color: 'var(--text)' }}>
          <Ic n="settings" size={20}/>
        </button>
      </div>

      <div className="relative overflow-hidden rounded-3xl p-6 shadow-lg" style={{ background: 'linear-gradient(145deg, rgba(30,58,138,0.2), rgba(6,78,59,0.15))', border: '1px solid rgba(59,130,246,0.25)' }}>
        <div className="absolute top-0 left-0 w-full h-1" style={{ background: 'linear-gradient(90deg, #3b82f6, #10b981)' }}/>
        <p className="text-xs font-bold uppercase mb-2 tracking-widest text-gray-300">היום, {dayName}</p>
        <p className="text-3xl font-black mb-1 drop-shadow-md" style={{ color: planned?.hex || 'var(--text)' }}>
          {planned?.name || 'מנוחה והתאוששות'}
        </p>
        {planned && <p className="text-sm font-medium text-gray-400">{planned.exercises.length} תרגילים במערך</p>}
        {planned && (
          <button onClick={() => { setWorkout(planned.id); setPage('home'); }}
            className="mt-5 w-full py-3.5 rounded-xl text-base font-black btn-press flex items-center justify-center gap-2 bg-blue-600 text-white shadow-[0_4px_15px_rgba(37,99,235,0.4)]">
            <Ic n="arrowLeft" size={18}/> כניסה לאימון
          </button>
        )}
      </div>

      <div className="grid grid-cols-3 gap-3">
        {[
          { ico: 'flame', val: stats.streak, label: 'רצף ימים', col: '#f97316' },
          { ico: 'check', val: stats.monthDone, label: 'בוצעו החודש', col: '#10b981' },
          { ico: 'trophy', val: stats.totalDone, label: 'סה"כ אימונים', col: '#f59e0b' },
        ].map(({ ico, val, label, col }) => (
          <div key={label} className="card2 p-4 flex flex-col items-center justify-center gap-1.5 shadow-md">
            <Ic n={ico} size={22} style={{ color: col }} />
            <span className="text-2xl font-black text-white leading-none">{val}</span>
            <span className="text-[10px] font-bold text-gray-400 uppercase text-center">{label}</span>
          </div>
        ))}
      </div>

      <div className="grid gap-3 mt-2">
        <h3 className="text-sm font-black text-gray-300 mb-1 px-1">תוכניות אימון זמינות</h3>
        {dispCats.map((cat, i) => (
          <div key={cat.id} className="flex items-center gap-2">
            {manage && (
              <div className="flex flex-col gap-1">
                <button onClick={() => moveCat(i, -1)} className="p-2 rounded-lg btn-press bg-white/5 text-gray-400"><Ic n="arrowUp" size={16}/></button>
                <button onClick={() => moveCat(i, 1)} className="p-2 rounded-lg btn-press bg-white/5 text-gray-400"><Ic n="arrowDown" size={16}/></button>
              </div>
            )}
            <button onClick={() => manage ? renameCat(i) : setWorkout(cat.id)}
              className={`flex-1 flex items-center justify-between p-5 rounded-2xl btn-press transition-all ${manage ? 'border-blue-500/50 bg-blue-500/5' : 'card'}`}>
              {manage ? <Ic n="edit" size={20} style={{ color: 'var(--blue)' }}/> : <Ic n="arrowLeft" size={20} style={{ color: 'rgba(255,255,255,0.2)' }}/>}
              <div className="flex items-center gap-4">
                <span className="text-lg font-black text-white">{cat.name}</span>
                <span className="p-3 rounded-xl shadow-inner" style={{ background: 'rgba(0,0,0,0.4)', color: cat.hex }}><Ic n={cat.icon} size={22}/></span>
              </div>
            </button>
            {manage && <button onClick={() => delCat(i)} className="p-5 rounded-2xl btn-press bg-rose-500/10 text-rose-500 border border-rose-500/20"><Ic n="trash" size={20}/></button>}
          </div>
        ))}
        {manage && (
          <button onClick={addCat} className="w-full mt-2 p-5 rounded-2xl font-bold flex flex-col items-center gap-2 btn-press border-2 border-dashed border-white/20 text-gray-400 hover:text-white hover:border-white/40 transition-colors">
            <Ic n="plus" size={24}/> הוסף תוכנית חדשה
          </button>
        )}
      </div>
      {renderCal}
    </div>
  );

  const renderWorkoutDetail = () => {
    const cat = dispCats.find(c => c.id === workout);
    if (!cat) return null;
    const todayRec = hist[todayKey];
    
    return (
      <div className="p-5 pb-32 fade-in" dir="rtl">
        <div className="flex justify-between items-center mt-6 mb-8 px-1">
          {!manage ? (
            <button onClick={() => setWorkout(null)} className="flex items-center gap-2 btn-press text-gray-400 hover:text-white transition-colors bg-white/5 px-4 py-2 rounded-xl">
              <Ic n="chevR" size={20}/><span className="font-bold text-sm">חזור לראשי</span>
            </button>
          ) : (
            <span className="text-xs font-black px-4 py-2 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400">מצב עריכת מערך</span>
          )}
          {!manage && <button onClick={enterManage} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-300 border border-white/10"><Ic n="settings" size={20}/></button>}
        </div>

        <div className="mb-8 px-2">
          <p className="text-sm font-black uppercase mb-1 tracking-widest" style={{ color: cat.hex }}>ניהול תוכנית</p>
          <h2 className="text-4xl font-black text-white drop-shadow-md">{cat.name}</h2>
          <p className="text-sm mt-2 text-gray-400">{cat.exercises.length} תרגילים מוגדרים במערך זה</p>
        </div>

        {!manage && (
          <div className="flex gap-3 mb-8">
            {[
              { status: 'done', ico: 'check', label: 'סימון כבוצע', bg: '#059669', activeBg: 'rgba(16,185,129,0.1)', borderCol: 'rgba(16,185,129,0.3)', textCol: '#34d399' },
              { status: 'missed', ico: 'x', label: 'דילוג / ביטול', bg: '#e11d48', activeBg: 'rgba(244,63,94,0.1)', borderCol: 'rgba(244,63,94,0.3)', textCol: '#fb7185' },
            ].map(({ status, ico, label, bg, activeBg, borderCol, textCol }) => {
              const active = todayRec?.status === status && todayRec?.type === workout;
              return (
                <button key={status} onClick={() => updateHist(todayKey, status, workout)}
                  className={`flex-1 flex flex-col items-center justify-center py-4 rounded-2xl btn-press transition-all duration-300 ${active ? 'scale-105' : ''}`}
                  style={{ background: active ? bg : activeBg, border: `1px solid ${active ? bg : borderCol}`, color: active ? 'white' : textCol, boxShadow: active ? `0 8px 25px ${bg}60` : 'none' }}>
                  <Ic n={ico} size={24} cls="mb-1.5"/>
                  <span className="font-black text-sm">{label}</span>
                </button>
              );
            })}
          </div>
        )}

        <div className="space-y-4">
          {cat.exercises.map((ex, idx) => (
            <div key={ex.id} className="flex gap-2">
              {manage && (
                <div className="flex flex-col gap-1 justify-center">
                  <button onClick={() => moveEx(idx, -1)} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400"><Ic n="arrowUp" size={16}/></button>
                  <button onClick={() => moveEx(idx, 1)} className="p-2.5 rounded-xl btn-press bg-white/5 text-gray-400"><Ic n="arrowDown" size={16}/></button>
                </div>
              )}
              <div className={`flex-1 p-5 rounded-2xl relative overflow-hidden flex justify-between items-center transition-colors ${manage ? 'bg-blue-500/5 border border-blue-500/30' : 'card'}`}>
                <div className="absolute top-0 right-0 w-2 h-full opacity-60 rounded-l-full shadow-[0_0_10px_currentColor]" style={{ backgroundColor: cat.hex, color: cat.hex }}/>
                <div className="flex-1 pr-4">
                  <h4 className="font-black text-lg mb-3 text-white">{ex.name}</h4>
                  <div className="flex gap-6 text-sm">
                    {[['סטים', ex.sets, 'rgba(255,255,255,0.6)'], ['חזרות', ex.reps, 'rgba(255,255,255,0.6)'], ['משקל ק"ג', ex.weight, cat.hex]].map(([l, v, c]) => (
                      <div key={l} className="flex flex-col">
                        <span className="text-[10px] font-bold uppercase mb-1 text-gray-400">{l}</span>

                  <div className="flex flex-col gap-2.5">

            </div>

          {manage && (
            <button onClick={addEx} className="w-full mt-4 p-5 rounded-2xl font-bold flex flex-col items-center gap-2 btn-press border-2 border-dashed border-white/20 text-gray-400 hover:text-white hover:border-white/40 transition-colors">

            </button>
          )}

  const renderStats = () => {
    const maxW = Math.max(...stats.weeks, 1);

    Object.values(hist).filter(r => r.status === 'done').forEach(r => { catBreak[r.type] = (catBreak[r.type] || 0) + 1; });
    const rate = stats.monthDone + stats.monthMissed > 0 ? Math.round((stats.monthDone / (stats.monthDone + stats.monthMissed)) * 100) : 0;
    
    return (
      <div className="p-5 pb-28 slide-up" dir="rtl">
        <h2 className="text-3xl font-black mt-6 mb-8 text-white px-2">סטטיסטיקה ומעקב</h2>

        <div className="grid grid-cols-2 gap-4 mb-6">

            { ico: 'flame', val: stats.streak, label: 'רצף נוכחי', sub: 'ימי אימון רצופים', col: '#f97316' },

            { ico: 'check', val: stats.monthDone, label: 'החודש', sub: 'ביצועים חודשיים', col: '#10b981' },

          ].map(({ ico, val, label, sub, col }) => (
            <div key={label} className="card p-5 flex flex-col items-center text-center">
              <Ic n={ico} size={28} cls="mb-3" style={{ color: col, filter: `drop-shadow(0 0 8px ${col}40)` }}/>
              <div className="text-4xl font-black mb-1.5 text-white">{val}</div>
              <div className="text-sm font-black text-gray-200">{label}</div>
              <div className="text-[10px] mt-1 leading-tight text-gray-500 font-medium">{sub}</div>
            </div>
          ))}
        </div>

        <div className="card p-6 mb-6">
          <h3 className="font-black text-sm mb-5 text-white">גרף אימונים (8 שבועות אחרונים)</h3>
          <div className="flex items-end gap-2 h-32">
            {stats.weeks.map((cnt, i) => (
              <div key={i} className="flex-1 flex flex-col items-center gap-1.5">
                <span className="text-xs font-bold text-gray-400">{cnt > 0 ? cnt : ''}</span>
                <div className="w-full rounded-t-lg transition-all duration-700 ease-out" style={{
                  height: `${Math.max((cnt / maxW) * 90, cnt > 0 ? 8 : 4)}px`,
                  background: cnt > 0 ? `linear-gradient(180deg, ${i === 7 ? '#3b82f6' : '#475569'}, ${i === 7 ? '#1d4ed8' : '#1e293b'})` : 'rgba(255,255,255,0.05)',
                  boxShadow: i === 7 && cnt > 0 ? '0 0 10px rgba(59,130,246,0.3)' : 'none',
                  opacity: cnt > 0 ? 0.6 + (cnt / maxW) * 0.4 : 1,
                }}/>
                <span className="text-[9px] text-gray-500 font-bold">{i === 7 ? 'נוכחי' : `ש' ${8-i}`}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="card p-6 mb-6">
          <h3 className="font-black text-sm mb-5 text-white">התפלגות סוגי אימון</h3>
          <div className="space-y-4">
            {cats.map(cat => {
              const cnt = catBreak[cat.id] || 0;
              const pct = stats.totalDone > 0 ? (cnt / stats.totalDone) * 100 : 0;
              return (
                <div key={cat.id}>
                  <div className="flex justify-between text-sm mb-2">
                    <div className="flex items-center gap-2.5">
                      <div className="w-2.5 h-2.5 rounded-full shadow-sm" style={{ backgroundColor: cat.hex, boxShadow: `0 0 6px ${cat.hex}` }}/>
                      <span className="font-bold text-white">{cat.name}</span>
                    </div>
                    <span className="font-medium text-gray-400">{cnt} אימונים ({Math.round(pct)}%)</span>
                  </div>
                  <div className="h-2.5 rounded-full overflow-hidden bg-white/5 border border-white/5">
                    <div className="h-full rounded-full transition-all duration-1000 ease-out" style={{ width: `${pct}%`, backgroundColor: cat.hex, boxShadow: `0 0 10px ${cat.hex}80` }}/>
                  </div>
                </div>
              );
            })}
          </div>
          {stats.totalDone === 0 && <p className="text-center text-sm mt-4 text-gray-500 font-medium">המערכת ממתינה לנתונים... התחל לתעד! 💪</p>}
        </div>
      </div>
    );
  };

  const renderSettings = () => (
    <div className="p-5 pb-28 slide-up" dir="rtl">
      <h2 className="text-3xl font-black mt-6 mb-8 text-white px-2">הגדרות מערכת</h2>

      <div className="card p-6 mb-5">
        <h3 className="font-black text-sm mb-5 flex items-center gap-2.5 text-white">
          <span className="p-1.5 bg-blue-500/10 rounded-lg text-blue-400"><Ic n="calendar" size={18}/></span> לוח אימונים קבוע
        </h3>
        <div className="space-y-2.5">
          {[0, 1, 2, 3, 4, 5, 6].map(di => {
            const pid = sched[di];
            const c = cats.find(x => x.id === pid);
            return (
              <div key={di} className="flex items-center gap-3 p-3.5 rounded-xl border border-white/5 bg-black/20 transition-colors focus-within:border-blue-500/30">
                <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 text-sm font-black bg-white/5 text-gray-400">{DAY_LET[di]}</div>
                <span className="text-sm font-bold w-14 flex-shrink-0 text-gray-300">{DAY_NAMES[di]}</span>
                <select className="flex-1 p-2 rounded-lg text-sm font-bold outline-none styled-input bg-transparent border-none focus:ring-0" dir="rtl"
                  value={pid || ''}
                  onChange={e => setSched(prev => ({ ...prev, [di]: e.target.value || null }))}>
                  <option value="" className="text-gray-800">☕ מנוחה / ללא אימון</option>
                  {cats.map(cat => <option key={cat.id} value={cat.id} className="text-gray-800">{cat.name}</option>)}
                </select>
                {c && <div className="w-3 h-3 rounded-full flex-shrink-0 shadow-sm" style={{ backgroundColor: c.hex, boxShadow: `0 0 6px ${c.hex}80` }}/>}
              </div>
            );
          })}
        </div>
      </div>

      <div className="card p-6 mb-5">
        <h3 className="font-black text-sm mb-4 flex items-center gap-2.5 text-white">
          <span className="p-1.5 bg-emerald-500/10 rounded-lg text-emerald-400"><Ic n="download" size={18}/></span> ניהול נתונים (I/O)
        </h3>
        <p className="text-xs mb-5 leading-relaxed text-gray-400 font-medium">
          הנתונים נשמרים מקומית על הדפדפן. מומלץ לבצע גיבוי תקופתי כקובץ JSON.
        </p>
        <div className="space-y-3">
          <button onClick={exportData} className="w-full p-4 rounded-xl font-black flex items-center justify-center gap-2.5 btn-press bg-blue-500/10 border border-blue-500/20 text-blue-400 hover:bg-blue-500/20 transition-colors">
            <Ic n="download" size={20}/> ייצוא קובץ גיבוי
          </button>
          <button onClick={() => fileRef.current?.click()} className="w-full p-4 rounded-xl font-black flex items-center justify-center gap-2.5 btn-press bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20 transition-colors">
            <Ic n="upload" size={20}/> טעינת גיבוי קיים
          </button>
          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importData}/>
        </div>
      </div>

      <div className="p-6 rounded-2xl border border-rose-500/20 bg-rose-500/5">
        <h3 className="font-black text-sm mb-4 flex items-center gap-2.5 text-rose-500">
          <span className="p-1.5 bg-rose-500/10 rounded-lg"><Ic n="info" size={18}/></span> ניהול סיכונים
        </h3>
        <button onClick={resetAll} className="w-full p-4 rounded-xl font-black flex items-center justify-center gap-2.5 btn-press bg-rose-500/10 border border-rose-500/30 text-rose-500 hover:bg-rose-500/20 transition-colors">
          <Ic n="refresh" size={20}/> איפוס מוחלט של המערכת
        </button>
      </div>
    </div>
  );

  const NAV = [
    { id: 'home', n: 'home', label: 'ראשי' },
    { id: 'stats', n: 'barChart', label: 'נתונים' },
    { id: 'settings', n: 'settings', label: 'הגדרות' },
  ];

  const fmtTime = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;

  return (
    <div className="min-h-screen">
      <main className="relative z-10 max-w-lg mx-auto min-h-screen">
        {workout ? renderWorkoutDetail() : page === 'home' ? renderHome() : page === 'stats' ? renderStats() : renderSettings()}
      </main>

      {/* FLOAT ACTION TIMER */}
      {!manage && (
        <div className="fixed z-50 transition-all duration-300" style={{ bottom: '6rem', left: '1.5rem' }}>
          <button onClick={() => setTimerOpen(true)}
            className={`flex flex-col items-center justify-center rounded-[1.25rem] btn-press transition-all duration-300 ${timeLeft > 0 ? 'w-16 h-16 glow-pulse' : 'w-14 h-14'}`}
            style={{
              background: timeLeft > 0 ? 'linear-gradient(135deg, #3b82f6, #1d4ed8)' : 'var(--surface)',
              border: `1px solid ${timeLeft > 0 ? 'rgba(59,130,246,0.5)' : 'var(--border)'}`,
              boxShadow: timeLeft > 0 ? '0 10px 25px rgba(59,130,246,0.5)' : '0 4px 15px rgba(0,0,0,0.3)',
              color: timeLeft > 0 ? 'white' : 'var(--blue)',
              backdropFilter: 'blur(8px)',
            }}>
            {timeLeft > 0 ? (
              <>
                <span className="text-lg font-black leading-none drop-shadow-sm">{timeLeft < 60 ? timeLeft : fmtTime(timeLeft)}</span>
                <span className="text-[9px] font-bold uppercase mt-1 tracking-wider opacity-90">{timerOn ? 'פעיל' : 'מושהה'}</span>
              </>
            ) : (
              <Ic n="clock" size={26}/>
            )}
          </button>
        </div>
      )}

      {/* BOTTOM NAVIGATION LAYER */}
      {!manage && (
        <nav className="fixed bottom-0 left-0 w-full z-40 flex pb-safe" dir="rtl"
          style={{ background: 'rgba(6, 6, 10, 0.85)', borderTop: '1px solid var(--border)', backdropFilter: 'blur(20px)', paddingBottom: 'env(safe-area-inset-bottom)' }}>
          {NAV.map(item => {
            const active = page === item.id && !workout;
            return (
              <button key={item.id} onClick={() => { setPage(item.id); setWorkout(null); if (manage) cancelManage(); }}
                className="flex-1 py-4 flex flex-col items-center gap-1.5 transition-all btn-press"
                style={{ color: active ? 'var(--blue)' : 'rgba(255,255,255,0.35)' }}>
                <div className={`transition-transform duration-300 ${active ? 'scale-110 drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]' : ''}`}>
                  <Ic n={item.n} size={22}/>
                </div>
                <span className="text-[10px] font-bold tracking-wide">{item.label}</span>
                {active && <div className="absolute top-0 w-8 h-0.5 bg-blue-500 rounded-b-full shadow-[0_2px_8px_rgba(59,130,246,0.8)]"/>}
              </button>
            );
          })}
        </nav>
      )}

      {/* MANAGE MODE ACTION BAR */}
      {manage && (
        <div className="fixed bottom-0 left-0 w-full p-4 z-[150] flex gap-3 slide-up pb-safe"
          style={{ background: 'rgba(6, 6, 10, 0.95)', borderTop: '1px solid var(--border)', backdropFilter: 'blur(15px)', paddingBottom: 'calc(1rem + env(safe-area-inset-bottom))' }}>
          <button onClick={saveManage} className="flex-1 p-4 rounded-2xl font-black flex items-center justify-center gap-2 btn-press bg-emerald-600 text-white shadow-[0_4px_20px_rgba(5,150,105,0.4)]">
            <Ic n="check" size={20}/> עדכון ושמירה
          </button>
          <button onClick={cancelManage} className="flex-1 p-4 rounded-2xl font-black flex items-center justify-center gap-2 btn-press bg-white/5 border border-white/10 text-gray-300">
            <Ic n="x" size={20}/> ביטול וסגירה
          </button>
        </div>
      )}

      {/* FULLSCREEN TIMER MODAL */}
      {timerOpen && (
        <div className="fixed inset-0 z-[100] flex items-end fade-in" style={{ background: 'rgba(0,0,0,0.8)', backdropFilter: 'blur(12px)' }}>
          <div className="w-full rounded-t-[2.5rem] p-8 pb-12 slide-up" dir="rtl"
            style={{ background: 'var(--surface2)', borderTop: '1px solid var(--border)', boxShadow: '0 -10px 40px rgba(0,0,0,0.5)' }}>
            <div className="w-16 h-1.5 rounded-full mx-auto mb-8 cursor-pointer bg-white/10 btn-press" onClick={() => setTimerOpen(false)}/>
            <h3 className="text-center text-xl font-black mb-4 text-white tracking-wide">טיימר התאוששות</h3>
            
            {timeLeft > 0 && (
              <div className="text-center mb-8">
                <span className={`text-7xl font-black transition-opacity duration-300 ${timerOn ? 'drop-shadow-[0_0_15px_rgba(59,130,246,0.6)]' : 'opacity-40'}`}
                  style={{ color: 'var(--blue)', fontVariantNumeric: 'tabular-nums' }}>
                  {fmtTime(timeLeft)}
                </span>
              </div>
            )}
            
            <div className="flex justify-center gap-3 mb-8 flex-wrap">
              {[30, 45, 60, 90, 120].map(s => {
                const active = timeLeft === s && timerOn;
                return (
                  <button key={s} onClick={() => startTimer(s)}
                    className="w-[72px] h-[72px] rounded-2xl flex flex-col items-center justify-center btn-press transition-all duration-300"
                    style={{
                      background: active ? 'var(--blue)' : 'rgba(255,255,255,0.04)',
                      color: active ? 'white' : 'var(--muted)',
                      border: `1px solid ${active ? 'rgba(59,130,246,0.8)' : 'var(--border)'}`,
                      boxShadow: active ? '0 8px 20px rgba(59,130,246,0.4)' : 'none',
                    }}>
                    <span className="text-2xl font-black leading-none">{s < 60 ? s : s / 60 + 'm'}</span>
                    <span className="text-[10px] font-bold mt-1.5 uppercase">{s < 60 ? 'שניות' : 'דקות'}</span>
                  </button>
                );
              })}
            </div>
            
            {timeLeft > 0 && (
              <button onClick={() => { setTimeLeft(0); setTimerOn(false); }} 
                className="w-full py-4 rounded-xl font-black mb-3 btn-press flex items-center justify-center gap-2 bg-rose-500/10 text-rose-500 border border-rose-500/20 hover:bg-rose-500/20 transition-colors">
                <Ic n="stop" size={18}/> הפסק טיימר
              </button>
            )}
            <button onClick={() => setTimerOpen(false)} 
              className="w-full py-4 rounded-xl font-black btn-press bg-white/5 text-gray-300 border border-white/5 hover:bg-white/10 transition-colors">
              חזרה למסך הקודם
            </button>
          </div>
        </div>
      )}

      {editEx && <ExerciseEditModal exercise={editEx} onSave={saveEx} onClose={() => setEditEx(null)} />}
      {selDate && <DayInfoModal dateInfo={selDate} onClose={() => setSelDate(null)} history={hist} categories={cats} schedule={sched} onUpdateStatus={updateHist} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
